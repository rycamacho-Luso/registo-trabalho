# Compila a aplicação "Registo de Militantes" para Windows (.exe instalador e portátil)
name: Compilar aplicação Windows

on:
  push:
    branches: ['main', 'claude/**']
    paths: ['militantes/**', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependências
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Compilar o .exe
        working-directory: desktop
        run: npm run dist

      - name: Calcular SHA-256 dos ficheiros
        working-directory: desktop/dist
        shell: pwsh
        run: Get-FileHash *.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Tee-Object -FilePath SHA256SUMS.txt

      - name: Guardar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: Registo-de-Militantes-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS.txt
          retention-days: 30
