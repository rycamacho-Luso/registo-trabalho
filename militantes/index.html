<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#006530">
<meta name="description" content="Registo e gestão de militantes de partido político — dados guardados localmente.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Registo de Militantes</title>
<style>
/* Letra Manrope incluída localmente (SIL Open Font License — fonts/OFL.txt): sem pedidos a servidores externos */
@font-face{font-family:Manrope;font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/manrope-latin-wght-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Manrope;font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/manrope-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Paleta retirada de https://mpt.pt/styles.css (escala --g-*) e do verde do logótipo (#006530) */
:root{
  --brand:#006530; --brand-d:#004D24;
  --g-50:#F2FAE6; --g-100:#E1F4C7; --g-200:#C8E89A; --g-300:#A8D767; --g-400:#8AC23E;
  --g-500:#6FA831; --g-600:#588C26; --g-700:#45711F; --g-800:#34561A; --g-900:#243C13; --g-950:#11200A;
  --bg:#F6F8F5; --surface:#FFFFFF; --surface-2:#FCFCFB; --ink:#16201A; --muted:#6A7464; --line:#D9E0D5; --line-2:#EDF1EA;
  --accent:var(--brand); --accent-soft:var(--g-50); --ring:rgba(111,168,49,.35);
  --ok:#2E7D32; --warn:#B45309; --warn-2:#FEF3E2; --danger:#B42318; --danger-2:#FDECEA;
  --side:linear-gradient(170deg,#004D24 0%,#11200A 100%); --side-ink:#EAF5DC;
  --shadow-sm:0 2px 4px rgba(17,32,10,.04); --shadow-md:0 8px 24px rgba(17,32,10,.07); --shadow-lg:0 24px 60px rgba(17,32,10,.14);
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E150F; --surface:#151F16; --surface-2:#1A261B; --ink:#E6EFE2; --muted:#9AA894; --line:#2A3A2B; --line-2:#1F2C20;
    --accent:#8AC23E; --accent-soft:#1D2E15; --ring:rgba(138,194,62,.35);
    --warn:#F59E0B; --warn-2:#2E2210; --danger:#F87171; --danger-2:#331817; --ok:#6FCF73;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E150F; --surface:#151F16; --surface-2:#1A261B; --ink:#E6EFE2; --muted:#9AA894; --line:#2A3A2B; --line-2:#1F2C20;
  --accent:#8AC23E; --accent-soft:#1D2E15; --ring:rgba(138,194,62,.35);
  --warn:#F59E0B; --warn-2:#2E2210; --danger:#F87171; --danger-2:#331817; --ok:#6FCF73;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

/* ---------- Barra lateral ---------- */
.side{background:var(--side);color:var(--side-ink);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.brand-logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.brand-logo img{max-width:100%;max-height:100%;object-fit:contain}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;color:#fff}
.brand small{display:block;font-size:12px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-weight:600;color:var(--side-ink);opacity:.85;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.08);opacity:1}
.nav button.on{background:var(--g-400);color:var(--g-950);opacity:1;box-shadow:0 8px 20px rgba(111,168,49,.3)}
.nav button:focus-visible{outline:2px solid var(--g-300);outline-offset:2px}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;font-size:12px;opacity:.7;padding:12px 10px;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:8px;align-items:flex-start}
.side-foot svg{width:16px;height:16px;flex:none;margin-top:2px}

/* ---------- Área principal ---------- */
.main{padding:28px 36px 60px;max-width:1280px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.head h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.head p{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--g-400)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(0,101,48,.22)}
.btn.pri:hover{background:var(--brand-d)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.danger:hover{background:var(--danger-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:13px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.pad{padding:22px}
.card h2{margin:0 0 14px;font-size:17px;font-weight:800}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{padding:20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line-2);position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:13px;font-weight:600}
.kpi .val{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:linear-gradient(135deg,#006530,#34561A);color:#fff;border:none}
.kpi.hero .lbl,.kpi.hero .sub{color:rgba(255,255,255,.8)}
.kpi.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(168,215,103,.18)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:10px;font-size:13.5px}
.bar-row .track{height:10px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;background:linear-gradient(90deg,var(--g-500),var(--g-400));border-radius:99px}
.bar-row .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty svg{width:56px;height:56px;color:var(--g-300);margin-bottom:8px}

/* Lista */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:240px;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{width:100%;padding:11px 14px 11px 42px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:focus-visible{outline:2px solid var(--g-400);outline-offset:-2px}
.who{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:12px;object-fit:cover;background:var(--g-100);color:var(--g-800);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.who b{display:block;font-weight:700}
.who small{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--g-50);color:var(--g-700)}
.pill.warn{background:var(--warn-2);color:var(--warn)}
.pill.bad{background:var(--danger-2);color:var(--danger)}
.pill.mute{background:var(--line-2);color:var(--muted)}
:root[data-theme="dark"] .pill:not(.warn):not(.bad):not(.mute){background:#1D2E15;color:var(--g-300)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill:not(.warn):not(.bad):not(.mute){background:#1D2E15;color:var(--g-300)}}

/* Formulários */
.steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line-2);font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font-size:12.5px}
.step.on{color:var(--ink);border-color:var(--g-400);box-shadow:0 0 0 3px var(--ring)}
.step.on i{background:var(--brand);color:#fff}
.step.done i{background:var(--g-400);color:var(--g-950)}
.step.err i{background:var(--danger);color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px 18px}
.f{display:flex;flex-direction:column;gap:6px;grid-column:span 6}
.f.c12{grid-column:span 12}.f.c8{grid-column:span 8}.f.c4{grid-column:span 4}.f.c3{grid-column:span 3}
.f label{font-weight:700;font-size:13.5px}
.f label .req{color:var(--danger)}
.f .hint{font-size:12.5px;color:var(--muted)}
.f .msg{font-size:12.5px;font-weight:600;min-height:0}
.f .msg.bad{color:var(--danger)}
.f .msg.ok{color:var(--ok)}
.f .msg.warn{color:var(--warn)}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g-500);box-shadow:0 0 0 4px var(--ring);background:var(--surface)}
input.bad,select.bad,textarea.bad{border-color:var(--danger)}
input.ok{border-color:var(--g-500)}
textarea{min-height:90px;resize:vertical}
.sec-title{grid-column:span 12;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-top:6px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.check{grid-column:span 12;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.check small{display:block;color:var(--muted);margin-top:2px}
.check.bad{border-color:var(--danger)}
.legal{grid-column:span 12;font-size:12.5px;color:var(--muted);background:var(--accent-soft);border-radius:12px;padding:12px 14px;border-left:4px solid var(--g-400)}
.form-foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-2)}

/* Foto */
.photo-wrap{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
.photo-box{width:240px;height:320px;border-radius:18px;background:var(--g-50);border:2px dashed var(--g-300);display:grid;place-items:center;overflow:hidden;position:relative;color:var(--g-600);text-align:center;font-size:13px}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box svg{width:56px;height:56px}
.crop{position:relative;width:300px;height:400px;border-radius:16px;overflow:hidden;background:#000;cursor:grab;touch-action:none;margin:0 auto}
.crop canvas{display:block}
.crop .guide{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 34% 30% at 50% 42%,transparent 98%,rgba(0,0,0,.35) 100%)}
video{width:100%;max-width:480px;border-radius:16px;background:#000;display:block;margin:0 auto}

/* Ficha */
.ficha{display:grid;grid-template-columns:220px 1fr;gap:26px}
.ficha .foto{width:220px;height:293px;border-radius:18px;object-fit:cover;background:var(--g-100);display:grid;place-items:center;font-size:56px;font-weight:800;color:var(--g-700)}
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 22px}
.dl div span{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.dl div b{font-weight:600;word-break:break-word}

/* Modal e toasts */
dialog{border:none;border-radius:var(--r-lg);padding:0;max-width:min(860px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(17,32,10,.55);backdrop-filter:blur(3px)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line-2)}
.dlg-h h3{margin:0;font-size:18px;font-weight:800}
.dlg-b{padding:22px;max-height:72vh;overflow:auto}
.dlg-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--g-950);color:#fff;padding:12px 18px;border-radius:14px;box-shadow:var(--shadow-lg);font-weight:600;display:flex;gap:10px;align-items:center;animation:in .25s ease}
.toast.bad{background:var(--danger)}
@keyframes in{from{transform:translateY(10px);opacity:0}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}


/* ---------- Fase 2: quotas e recibos ---------- */
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--g-500)}
.tabs button:focus-visible{outline:2px solid var(--g-400)}
.seg{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 12px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.per-ano{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:start;margin-bottom:8px}
.per-ano b{padding-top:7px;font-size:13px}
.per-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.per{all:unset;cursor:pointer;text-align:center;padding:7px 4px;border-radius:9px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;background:var(--surface-2)}
.per:hover:not(:disabled){border-color:var(--g-400)}
.per.atr{border-color:var(--danger);color:var(--danger);background:var(--danger-2)}
.per.on{background:var(--brand);border-color:var(--brand);color:#fff}
.per.pago{background:var(--g-100);border-color:var(--g-200);color:var(--g-700);cursor:not-allowed;text-decoration:line-through;opacity:.75}
.per-leg{display:flex;gap:8px;margin-top:6px}
.per-leg .per{cursor:default;padding:2px 10px;font-size:11px;text-decoration:none}
.alerta{padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-top:6px}
.alerta.bad{background:var(--danger-2);color:var(--danger)}
.alerta.warn{background:var(--warn-2);color:var(--warn)}
.meter{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--g-500),var(--g-400));border-radius:99px}
.mini-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
.mini-kpis div{padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2)}
.mini-kpis span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.mini-kpis b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.mini-kpis small{color:var(--muted)}
table.mini td{padding:8px 10px;font-size:13.5px}
tfoot td{border-bottom:none}
tr.anul td{opacity:.55}
.recibo{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--surface);position:relative}
.recibo.anulado::after{content:"ANULADO";position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:64px;font-weight:800;color:rgba(180,35,24,.18);letter-spacing:.1em;pointer-events:none}
.rc-head{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid var(--brand);padding-bottom:12px}
.rc-head>div:first-child{display:flex;gap:12px;align-items:center}
.rc-head img{max-height:48px;max-width:110px}
.rc-head small{display:block;color:var(--muted);font-size:12px}
.rc-num{text-align:right}
.rc-num span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.rc-num b{font-size:20px;color:var(--accent)}
.rc-num small{display:block;color:var(--muted);font-size:12px}
.rc-txt{margin:16px 0 6px}
.rc-valor{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px}
.rc-valor b{font-size:24px;font-weight:800}
.rc-valor span{font-style:italic;color:var(--muted)}
.rc-tbl{margin-top:14px}
.rc-tbl td{padding:7px 10px;font-size:13.5px;border-bottom:1px solid var(--line-2)}
.rc-tbl td:first-child{color:var(--muted);font-weight:700;width:32%}
.rc-anul{margin-top:12px;color:var(--danger);font-weight:700}
.rc-sign{display:flex;justify-content:flex-end;margin-top:36px}
.rc-sign div{border-top:1px solid var(--ink);padding-top:4px;width:220px;text-align:center;font-size:12px}
.rc-nota{font-size:11px;color:var(--muted);margin:14px 0 0}
@media print{
  .p-recibo .recibo{border:1px solid #999;border-radius:6px;padding:7mm;font-size:10pt;margin:0;page-break-inside:avoid;color:#000;background:#fff}
  .p-recibo .rc-txt{margin:8px 0 4px}.p-recibo .rc-valor{padding:6px 12px}.p-recibo .rc-valor b{font-size:16pt}.p-recibo .rc-tbl td{padding:4px 8px;font-size:9.5pt}.p-recibo .rc-sign{margin-top:18px}.p-recibo .rc-nota{margin-top:8px}
  .p-recibo .rc-valor{background:#F2FAE6}
  .p-recibo .rc-head{border-color:#006530}
  .p-recibo .rc-num b{color:#006530}
  .rc-corte{text-align:center;color:#888;font-size:8pt;margin:4mm 0}
}
@media (max-width:820px){.per-grid{grid-template-columns:repeat(4,1fr)}.mini-kpis{grid-template-columns:1fr}}

/* ---------- Fase 3: cartões ---------- */
.cartao-prev{display:grid;place-items:center;min-height:200px;background:repeating-conic-gradient(var(--line-2) 0 25%,transparent 0 50%) 0 0/20px 20px;border-radius:16px;padding:18px}
.cartao-prev img{width:100%;max-width:520px;aspect-ratio:85.6/54;border-radius:18px;box-shadow:var(--shadow-lg)}
.verif{margin-top:6px;padding:16px 18px;border-radius:14px;font-size:18px;letter-spacing:.02em}
.verif.ok{background:var(--g-100);color:var(--g-800)}

<script>
'use strict';
/* =====================================================================
   Registo de Militantes — Fase 1
   Base legal de referência:
   - Lei Orgânica n.º 2/2003 (Lei dos Partidos Políticos), versão
     consolidada da CNE com LO 2/2008 e LO 1/2018:
       art. 19.º (liberdade de filiação; estrangeiros residentes, n.º 4)
       art. 20.º (filiação pessoal; proibição de dupla filiação, n.º 2)
       art. 21.º (restrições: militares e forças de segurança, n.º 1)
   - RGPD (Reg. UE 2016/679), art. 9.º n.º 2 al. d) — opiniões políticas
     tratadas por partido, relativas aos seus membros.
   ===================================================================== */

/* ---------- Utilitários ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parseISO = s => { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null; const [y,m,d] = s.split('-').map(Number); const dt = new Date(y, m-1, d); return (dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d) ? dt : null; };
const isoDe = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtData = s => { const d = parseISO(s); return d ? d.toLocaleDateString('pt-PT') : '—'; };
const fmtDataHora = s => s ? new Date(s).toLocaleString('pt-PT') : '—';
const idadeEm = (nasc, ref = hoje()) => { let a = ref.getFullYear() - nasc.getFullYear(); const m = ref.getMonth() - nasc.getMonth(); if (m < 0 || (m === 0 && ref.getDate() < nasc.getDate())) a--; return a; };
const diasAte = d => Math.round((d - hoje()) / 86400000);
const iniciais = n => (n || '?').trim().split(/\s+/).filter(Boolean).map(p => p[0]).filter((_, i, a) => i === 0 || i === a.length - 1).join('').toUpperCase();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function toast(msg, bad = false) { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; $('#toasts').append(t); setTimeout(() => t.remove(), 3800); }

const DISTRITOS = ['Aveiro','Beja','Braga','Bragança','Castelo Branco','Coimbra','Évora','Faro','Guarda','Leiria','Lisboa','Portalegre','Porto','Santarém','Setúbal','Viana do Castelo','Vila Real','Viseu','Região Autónoma dos Açores','Região Autónoma da Madeira','Estrangeiro'];
const TIPOS_DOC = {
  CC: 'Cartão de Cidadão',
  TR: 'Título / Autorização de Residência',
  CUE: 'Certificado de Registo de Cidadão da UE',
  PASS: 'Passaporte'
};
const ESTADOS = { ativo: 'Ativo', suspenso: 'Suspenso', cessado: 'Filiação cessada' };

/* ---------- Validações ---------- */
const Val = {
  /* NIF português: 9 dígitos, dígito de controlo módulo 11 (pesos 9..2).
     Pessoas singulares: começa por 1, 2 ou 3; 45 = singular não residente. */
  nif(v) {
    const n = String(v || '').replace(/\s/g, '');
    if (!n) return { ok: false, msg: 'Indique o NIF.' };
    if (!/^\d{9}$/.test(n)) return { ok: false, msg: 'O NIF tem de ter exatamente 9 algarismos.' };
    let soma = 0; for (let i = 0; i < 8; i++) soma += +n[i] * (9 - i);
    const r = soma % 11, cd = r < 2 ? 0 : 11 - r;
    if (cd !== +n[8]) return { ok: false, msg: 'NIF inválido (dígito de controlo não confere).' };
    if (!/^[123]/.test(n) && !n.startsWith('45')) return { ok: false, msg: 'Este NIF não é de pessoa singular (deve começar por 1, 2, 3 ou 45).' };
    return { ok: true, msg: 'NIF válido.', val: n };
  },
  /* N.º de documento do Cartão de Cidadão: 8 díg. (n.º civil) + 1 díg. controlo
     + 2 caracteres de versão + 1 díg. controlo. Algoritmo da AMA:
     da direita para a esquerda, duplica posições pares (2.ª, 4.ª…), letras A=10…Z=35,
     subtrai 9 se >9, soma total múltipla de 10. */
  cc(v) {
    const n = String(v || '').toUpperCase().replace(/[\s-]/g, '');
    if (!n) return { ok: false, msg: 'Indique o número do documento.' };
    if (!/^\d{9}[A-Z0-9]{2}\d$/.test(n)) return { ok: false, msg: 'Formato esperado: 12345678 9 ZZ0 (12 caracteres).' };
    let soma = 0;
    for (let i = n.length - 1, pos = 0; i >= 0; i--, pos++) {
      const ch = n[i]; let val = /\d/.test(ch) ? +ch : ch.charCodeAt(0) - 55;
      if (pos % 2 === 1) { val *= 2; if (val > 9) val -= 9; }
      soma += val;
    }
    if (soma % 10 !== 0) return { ok: false, msg: 'Número do Cartão de Cidadão inválido (controlo não confere).' };
    return { ok: true, msg: 'Número de Cartão de Cidadão válido.', val: `${n.slice(0,8)} ${n[8]} ${n.slice(9)}` };
  },
  docGenerico(v) {
    const n = String(v || '').trim().toUpperCase();
    if (!n) return { ok: false, msg: 'Indique o número do documento.' };
    if (!/^[A-Z0-9 \-\/]{5,20}$/.test(n)) return { ok: false, msg: 'Use 5 a 20 letras/algarismos.' };
    return { ok: true, msg: '', val: n };
  },
  /* Validade do documento: não pode estar caducado; aviso se caduca em ≤ 60 dias.
     O CC tem validade máxima de 10 anos (Lei n.º 7/2007, na redação atual). */
  validade(v, tipo, nasc) {
    const d = parseISO(v);
    if (!d) return { ok: false, msg: 'Indique a data de validade.' };
    const dias = diasAte(d);
    if (dias < 0) return { ok: false, msg: `Documento caducado há ${-dias} dia(s). Peça um documento válido.` };
    const max = hoje(); max.setFullYear(max.getFullYear() + 10); max.setDate(max.getDate() + 1);
    if (tipo === 'CC' && d > max) return { ok: false, msg: 'Validade superior a 10 anos — verifique a data (o CC tem validade máxima de 10 anos).' };
    if (nasc && d < nasc) return { ok: false, msg: 'A validade não pode ser anterior à data de nascimento.' };
    if (dias <= 60) return { ok: true, warn: true, msg: `Atenção: o documento caduca dentro de ${dias} dia(s).` };
    return { ok: true, msg: `Válido até ${d.toLocaleDateString('pt-PT')}.` };
  },
  nascimento(v, idadeMin) {
    const d = parseISO(v);
    if (!d) return { ok: false, msg: 'Indique a data de nascimento.' };
    if (d > hoje()) return { ok: false, msg: 'A data de nascimento não pode ser futura.' };
    const a = idadeEm(d);
    if (a > 120) return { ok: false, msg: 'Data de nascimento improvável — verifique.' };
    if (a < idadeMin) return { ok: false, msg: `Idade ${a} anos — a idade mínima definida para filiação é ${idadeMin} anos.` };
    return { ok: true, msg: `${a} anos.` };
  },
  nome(v) {
    const n = String(v || '').trim().replace(/\s+/g, ' ');
    if (!n) return { ok: false, msg: 'Indique o nome completo.' };
    if (!/^[\p{L}][\p{L}' .\-]+$/u.test(n)) return { ok: false, msg: 'O nome só pode conter letras, espaços, hífen e apóstrofo.' };
    if (n.split(' ').length < 2) return { ok: false, msg: 'Indique o nome completo (pelo menos nome e apelido), tal como no documento.' };
    // Se escrito todo em minúsculas ou maiúsculas, normaliza (partículas da/de/do/das/dos/e ficam em minúsculas)
    const titulo = (n === n.toLowerCase() || n === n.toUpperCase())
      ? n.toLowerCase().split(' ').map((p, i) => (i && /^(da|de|do|das|dos|e|d')$/.test(p)) ? p : p.replace(/(^|[-'])(\p{L})/gu, (_, a, b) => a + b.toUpperCase())).join(' ')
      : n;
    return { ok: true, msg: '', val: titulo };
  },
  cp(v) {
    const n = String(v || '').trim();
    if (!n) return { ok: false, msg: 'Indique o código postal.' };
    if (!/^\d{4}-\d{3}$/.test(n)) return { ok: false, msg: 'Formato: 1234-567.' };
    if (+n.slice(0, 4) < 1000) return { ok: false, msg: 'Código postal inexistente (os CP portugueses começam em 1000).' };
    return { ok: true, msg: '' };
  },
  tel(v, obrig) {
    const n = String(v || '').replace(/[\s().-]/g, '');
    if (!n) return obrig ? { ok: false, msg: 'Indique um contacto telefónico.' } : { ok: true, msg: '' };
    if (/^(\+351|00351)?[29]\d{8}$/.test(n)) return { ok: true, msg: '' };
    if (/^(\+|00)\d{8,15}$/.test(n)) return { ok: true, msg: 'Número internacional.' };
    return { ok: false, msg: 'Número inválido (9 algarismos, a começar por 2 ou 9, ou formato internacional +…).' };
  },
  email(v) {
    const n = String(v || '').trim();
    if (!n) return { ok: true, msg: '' };
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(n) ? { ok: true, msg: '' } : { ok: false, msg: 'Endereço de email inválido.' };
  },
  req(v, nome) { return String(v || '').trim() ? { ok: true, msg: '' } : { ok: false, msg: `Preencha: ${nome}.` }; },
  eleitor(v) {
    const n = String(v || '').trim();
    if (!n) return { ok: true, msg: '' };
    return /^\d{1,10}$/.test(n) ? { ok: true, msg: '' } : { ok: false, msg: 'Apenas algarismos.' };
  }
};

/* ---------- Base de dados local (IndexedDB) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('registo-militantes', 3);
      r.onupgradeneeded = e => {
        const db = r.result;
        if (e.oldVersion < 1) {
          const s = db.createObjectStore('militantes', { keyPath: 'id' });
          s.createIndex('nif', 'nif', { unique: true });
          s.createIndex('numMilitante', 'numMilitante', { unique: true });
          db.createObjectStore('config');
        }
        if (e.oldVersion < 2) { // Fase 2: pagamentos e recibos
          const p = db.createObjectStore('pagamentos', { keyPath: 'id' });
          p.createIndex('militanteId', 'militanteId');
          p.createIndex('numRecibo', 'numRecibo', { unique: true });
        }
        if (e.oldVersion < 3) { // Fase 4: dados cifrados, utilizadores e auditoria
          db.createObjectStore('m3', { keyPath: 'id' });
          const p3 = db.createObjectStore('p3', { keyPath: 'id' }); p3.createIndex('numRecibo', 'numRecibo', { unique: true });
          db.createObjectStore('utilizadores', { keyPath: 'id' });
          db.createObjectStore('auditoria', { keyPath: 'id' });
        }
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, mode); const s = t.objectStore(store); let out;
      Promise.resolve(fn(s)).then(v => out = v);
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  req: r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  /* Fase 4: militantes (m3), recibos (p3) e auditoria são cifrados com a chave da sessão */
  async all() { return Promise.all((await DB.tx('m3', 'readonly', s => DB.req(s.getAll()))).map(r => Cripto.dec(r))); },
  async get(id) { const r = await DB.tx('m3', 'readonly', s => DB.req(s.get(id))); return r ? Cripto.dec(r) : undefined; },
  async put(m) { const r = await Cripto.enc(m); return DB.tx('m3', 'readwrite', s => DB.req(s.put(r))); },
  del(id) { return DB.tx('m3', 'readwrite', s => DB.req(s.delete(id))); },
  clear() { return DB.tx('m3', 'readwrite', s => DB.req(s.clear())); },
  async allPag() { return Promise.all((await DB.tx('p3', 'readonly', s => DB.req(s.getAll()))).map(r => Cripto.dec(r))); },
  async putPag(p) { const r = await Cripto.enc(p, { numRecibo: p.numRecibo }); return DB.tx('p3', 'readwrite', s => DB.req(s.put(r))); },
  clearPag() { return DB.tx('p3', 'readwrite', s => DB.req(s.clear())); },
  users() { return DB.tx('utilizadores', 'readonly', s => DB.req(s.getAll())); },
  putUser(u) { return DB.tx('utilizadores', 'readwrite', s => DB.req(s.put(u))); },
  getRec() { return DB.tx('config', 'readonly', s => DB.req(s.get('recuperacao'))); },
  setRec(w) { return DB.tx('config', 'readwrite', s => DB.req(s.put(w, 'recuperacao'))); },
  /* Grava o recibo e a numeração na mesma transação (evita números repetidos ou saltados) */
  async emitir(p, cfg) {
    const r = await Cripto.enc(p, { numRecibo: p.numRecibo });
    return new Promise((res, rej) => {
      const t = DB.db.transaction(['p3', 'config'], 'readwrite');
      t.objectStore('p3').add(r); t.objectStore('config').put(cfg, 'cfg');
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  getCfg() { return DB.tx('config', 'readonly', s => DB.req(s.get('cfg'))); },
  setCfg(c) { return DB.tx('config', 'readwrite', s => DB.req(s.put(c, 'cfg'))); }
};

/* Estado do documento de identificação */
function estadoDoc(m) {
  const d = parseISO(m.validadeDoc); if (!d) return { cls: 'mute', txt: '—' };
  const dias = diasAte(d);
  if (dias < 0) return { cls: 'bad', txt: 'Doc. caducado' };
  if (dias <= 60) return { cls: 'warn', txt: `Caduca em ${dias} d` };
  return { cls: '', txt: 'Doc. válido' };
}

  const aCad = L.filter(m => m.estado === 'ativo' && estadoDoc(m).cls === 'warn').length;
  const porDist = {}; ativos.forEach(m => porDist[m.distrito] = (porDist[m.distrito] || 0) + 1);
  const dist = Object.entries(porDist).sort((a, b) => b[1] - a[1]).slice(0, 10), maxD = dist[0]?.[1] || 1;

/* ---------- Recorte de fotografia (3:4) ---------- */
function recortar(img, cb) {
  const W = 300, H = 400;
  abrirDlg(`<div class="dlg-h"><h3>Ajustar fotografia</h3><button class="btn ghost sm" data-x aria-label="Fechar">${ICON.x}</button></div>
    <div class="dlg-b"><div class="crop" id="crop"><canvas id="cv" width="${W * 2}" height="${H * 2}" style="width:${W}px;height:${H}px"></canvas><div class="guide"></div></div>
    <div class="row" style="justify-content:center;margin-top:16px"><span class="muted">Zoom</span><input type="range" id="zoom" min="1" max="4" step="0.01" value="1" style="width:240px"></div>
    <p class="muted" style="text-align:center;font-size:13px">Arraste a imagem para centrar o rosto na oval.</p></div>
    <div class="dlg-f"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="okCrop">Usar fotografia</button></div>`);
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const base = Math.max(W / img.width, H / img.height);
  let z = 1, ox = 0, oy = 0;
  const limitar = () => { const s = base * z, w = img.width * s, h = img.height * s; ox = Math.min(0, Math.max(W - w, ox)); oy = Math.min(0, Math.max(H - h, oy)); };
  const centrar = () => { const s = base * z; ox = (W - img.width * s) / 2; oy = (H - img.height * s) / 2; };
  const draw = () => { limitar(); ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); const s = base * z; ctx.drawImage(img, ox, oy, img.width * s, img.height * s); };
  centrar(); draw();
  $('#zoom').oninput = e => { const cx = W / 2, cy = H / 2, s0 = base * z; z = +e.target.value; const s1 = base * z; ox = cx - (cx - ox) * s1 / s0; oy = cy - (cy - oy) * s1 / s0; draw(); };
  let drag = null;
  cv.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, ox, oy }; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!drag) return; ox = drag.ox + e.clientX - drag.x; oy = drag.oy + e.clientY - drag.y; draw(); };
  cv.onpointerup = () => drag = null;
  cv.onwheel = e => { e.preventDefault(); const zz = $('#zoom'); zz.value = Math.min(4, Math.max(1, z - e.deltaY * 0.002)); zz.dispatchEvent(new Event('input')); };
  $('#okCrop').onclick = () => {
    const out = document.createElement('canvas'); out.width = 450; out.height = 600;
    const o = out.getContext('2d'); const k = 450 / W, s = base * z * k;
    o.fillStyle = '#fff'; o.fillRect(0, 0, 450, 600); o.drawImage(img, ox * k, oy * k, img.width * s, img.height * s);
    cb(out.toDataURL('image/jpeg', 0.85)); fecharDlg();
  };
}
async function camara(cb) {
  if (!navigator.mediaDevices?.getUserMedia) return toast('A câmara não está disponível neste navegador.', true);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: 'user' }, audio: false }); }
  catch (e) { return toast('Sem acesso à câmara: ' + (e.name === 'NotAllowedError' ? 'permissão recusada.' : 'nenhuma câmara encontrada.'), true); }
  const parar = () => stream.getTracks().forEach(t => t.stop());
  abrirDlg(`<div class="dlg-h"><h3>Tirar fotografia</h3><button class="btn ghost sm" data-x aria-label="Fechar">${ICON.x}</button></div>
    <div class="dlg-b"><video id="vid" autoplay playsinline muted></video></div>
    <div class="dlg-f"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="snap">${ICON.cam} Capturar</button></div>`, parar);
  const v = $('#vid'); v.srcObject = stream;
  $('#snap').onclick = () => {
    const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
    const x = c.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(v, 0, 0);
    parar(); fecharDlg(true);

  };
}

/* ---------- Exportação / importação ---------- */
function descarregar(nome, conteudo, tipo) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo })); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportarCSV() {
  const cols = [['numMilitante', 'N.º militante'], ['nomeCompleto', 'Nome completo'], ['dataNascimento', 'Data nascimento'], ['sexo', 'Sexo'], ['nacionalidade', 'Nacionalidade'], ['tipoDoc', 'Tipo doc.'], ['numDoc', 'N.º documento'], ['validadeDoc', 'Validade doc.'], ['nif', 'NIF'], ['numEleitor', 'N.º eleitor'], ['morada', 'Morada'], ['codigoPostal', 'Código postal'], ['localidade', 'Localidade'], ['freguesia', 'Freguesia'], ['concelho', 'Concelho'], ['distrito', 'Distrito'], ['telemovel', 'Telemóvel'], ['email', 'Email'], ['estrutura', 'Estrutura'], ['dataAdmissao', 'Data admissão'], ['estado', 'Estado'], ['comunicacoes', 'Aceita comunicações']];
  // Proteção contra injeção de fórmulas no Excel (=, +, -, @)
  const cel = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const linhas = [cols.map(c => cel(c[1])).join(';'), ...LISTA.map(m => cols.map(([k]) => cel(k === 'estado' ? ESTADOS[m[k]] : typeof m[k] === 'boolean' ? (m[k] ? 'Sim' : 'Não') : m[k])).join(';'))];
  descarregar(`militantes_${isoDe(hoje())}.csv`, '﻿' + linhas.join('\r\n'), 'text/csv;charset=utf-8');
  toast('CSV exportado. Contém dados pessoais — guarde-o em local seguro.');
}
async function exportarBackup() {
  const dados = { app: 'registo-militantes', versao: 2, exportadoEm: new Date().toISOString(), config: CFG, militantes: await DB.all(), pagamentos: await DB.allPag() };
  descarregar(`copia-seguranca-militantes_${isoDe(hoje())}.json`, JSON.stringify(dados), 'application/json');
  CFG.ultimoBackup = new Date().toISOString(); await DB.setCfg(CFG);
  toast('Cópia de segurança criada.'); if (VIEW === 'config') ir('config');
}
async function importarBackup(file) {
  let d; try { d = JSON.parse(await file.text()); } catch { return toast('Ficheiro inválido.', true); }
  if (d?.app !== 'registo-militantes' || !Array.isArray(d.militantes)) return toast('Este ficheiro não é uma cópia de segurança desta aplicação.', true);
  const campos = ['id', 'nomeCompleto', 'nif', 'numMilitante'];
  const validos = d.militantes.filter(m => m && typeof m === 'object' && campos.every(c => typeof m[c] === 'string' && m[c]) && (!m.foto || /^data:image\/(jpeg|png|webp);base64,/.test(m.foto)));
  if (!confirm(`Importar ${validos.length} registo(s)? Registos com o mesmo identificador serão substituídos.${validos.length < d.militantes.length ? `\n${d.militantes.length - validos.length} registo(s) inválidos serão ignorados.` : ''}`)) return;
  let ok = 0, falha = 0;
  for (const m of validos) { try { await DB.put(m); ok++; } catch { falha++; } }
  let okP = 0;
  if (Array.isArray(d.pagamentos)) {
    for (const p of d.pagamentos) {
      if (!p || typeof p !== 'object' || typeof p.id !== 'string' || !/^\d{4}\/\d{4,}$/.test(p.numRecibo || '') || !(+p.valor > 0) || !TIPOS_PAG[p.tipo] || !METODOS[p.metodo]) continue;
      try { await DB.putPag(p); okP++; } catch { falha++; }
    }
  }
  if (d.config && typeof d.config === 'object') {
    const c = d.config; CFG.proximoNum = Math.max(CFG.proximoNum, +c.proximoNum || 1);
    // A numeração de recibos nunca recua
    for (const [a, n] of Object.entries(c.recibos || {})) if (/^\d{4}$/.test(a)) CFG.recibos[a] = Math.max(+CFG.recibos[a] || 1, +n || 1);
    await DB.setCfg(CFG);
  }
  if (okP) toast(`${okP} recibo(s) importado(s).`);
  await carregar(); toast(`${ok} registo(s) importado(s)${falha ? `, ${falha} em conflito (NIF/n.º duplicado)` : ''}.`, !!falha); ir('lista');
}

   - art. 3.º, n.º 1: receitas próprias — a) quotas e contribuições dos filiados;
     b) contribuições de eleitos; h) donativos de pessoas singulares.
   - art. 3.º, n.os 2 e 3: receitas em numerário têm de ser tituladas por meio bancário,
     exceto montantes < 25% do IAS, desde que no ano não ultrapassem 50 × IAS.
   - art. 7.º, n.º 1: donativos ≤ 25 × IAS por doador e por ano, por cheque ou transferência.
   - art. 8.º, n.º 1: proibidos donativos anónimos e de pessoas coletivas.
   - art. 12.º: contabilidade organizada com discriminação das receitas por alínea do art. 3.º.
   ===================================================================== */
const TIPOS_PAG = { quota: 'Quota', donativo: 'Donativo', eleito: 'Contribuição de eleito' };
const BASE_LEGAL_PAG = {
  quota: 'Receita própria — art. 3.º, n.º 1, al. a), da Lei n.º 19/2003',
  donativo: 'Donativo de pessoa singular — art. 3.º, n.º 1, al. h), e art. 7.º da Lei n.º 19/2003',
  eleito: 'Contribuição de eleito — art. 3.º, n.º 1, al. b), da Lei n.º 19/2003'
};
const METODOS = { transferencia: 'Transferência bancária', mbway: 'MB WAY', multibanco: 'Referência Multibanco', debito: 'Débito direto', cheque: 'Cheque', numerario: 'Numerário' };
const METODOS_DONATIVO = ['transferencia', 'mbway', 'cheque'];
const REGIMES = { normal: 'Normal', reduzida: 'Reduzida', isento: 'Isento' };
const PERIODICIDADES = { mensal: 'Mensal', trimestral: 'Trimestral', semestral: 'Semestral', anual: 'Anual' };
const PER_N = { mensal: 12, trimestral: 4, semestral: 2, anual: 1 };
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const r2 = v => Math.round(v * 100) / 100;
const eur = v => (+v || 0).toLocaleString('pt-PT', { style: 'currency', currency: 'EUR' });
const lerValor = v => { const n = parseFloat(String(v || '').replace(/\s|€/g, '').replace(',', '.')); return isNaN(n) ? NaN : r2(n); };

/* IAS do ano (ou o último conhecido anterior) */
function ias(ano) {
  const t = CFG.ias || {}; if (+t[ano]) return +t[ano];
  const anos = Object.keys(t).map(Number).filter(a => a <= ano).sort((a, b) => b - a);
  return anos.length ? +t[anos[0]] : 537.13;
}

/* NIF de pessoa coletiva (só dígito de controlo) */
function validarNIFColetivo(v) {
  const n = String(v).replace(/\s/g, ''); if (!/^\d{9}$/.test(n)) return false;
  let s = 0; for (let i = 0; i < 8; i++) s += +n[i] * (9 - i); const r = s % 11; return (r < 2 ? 0 : 11 - r) === +n[8];
}

/* Valor por extenso (português europeu) */
function porExtenso(v) {
  const U = ['zero', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'catorze', 'quinze', 'dezasseis', 'dezassete', 'dezoito', 'dezanove'];
  const D = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const C = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
  const ate999 = n => { if (n === 100) return 'cem'; const c = Math.floor(n / 100), r = n % 100, p = []; if (c) p.push(C[c]); if (r) p.push(r < 20 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' e ' + U[r % 10] : '')); return p.join(' e '); };
  const inteiro = n => {
    const mi = Math.floor(n / 1e6), mil = Math.floor(n % 1e6 / 1000), r = n % 1000, p = [];
    if (mi) p.push(mi === 1 ? 'um milhão' : ate999(mi) + ' milhões');
    if (mil) p.push(mil === 1 ? 'mil' : ate999(mil) + ' mil');
    if (r) p.push(ate999(r));
    if (p.length > 1 && r && (r < 100 || r % 100 === 0)) { const u = p.pop(); return p.join(' ') + ' e ' + u; }
    return p.join(' ');
  };
  const cent = Math.round(v * 100), e = Math.floor(cent / 100), c = cent % 100;
  const eS = e ? `${inteiro(e)}${e % 1e6 === 0 ? ' de' : ''} ${e === 1 ? 'euro' : 'euros'}` : '';
  const cS = c ? `${ate999(c)} ${c === 1 ? 'cêntimo' : 'cêntimos'}` : '';
  return [eS, cS].filter(Boolean).join(' e ') || 'zero euros';
}

/* ---------- Períodos de quota ---------- */
function periodoDe(d) {
  const p = CFG.periodicidade, y = d.getFullYear(), m = d.getMonth();
  if (p === 'mensal') return `${y}-${String(m + 1).padStart(2, '0')}`;
  if (p === 'trimestral') return `${y}-T${Math.floor(m / 3) + 1}`;
  if (p === 'semestral') return `${y}-S${Math.floor(m / 6) + 1}`;
  return `${y}`;
}
function periodosEntre(d1, d2) {
  const out = [], step = 12 / PER_N[CFG.periodicidade];
  let y = d1.getFullYear(), m = Math.floor(d1.getMonth() / step) * step;
  while (y < d2.getFullYear() || (y === d2.getFullYear() && m <= d2.getMonth())) { out.push(periodoDe(new Date(y, m, 1))); m += step; if (m >= 12) { m = 0; y++; } }
  return out;
}
function nomePeriodo(k) {
  let r;
  if ((r = k.match(/^(\d{4})-(\d{2})$/))) return `${MESES[+r[2] - 1]} ${r[1]}`;
  if ((r = k.match(/^(\d{4})-T(\d)$/))) return `${r[2]}.º trim. ${r[1]}`;
  if ((r = k.match(/^(\d{4})-S(\d)$/))) return `${r[2]}.º sem. ${r[1]}`;
  return `ano ${k}`;
}
function descrPeriodos(keys) {
  const k = [...(keys || [])].sort(); if (!k.length) return '';
  if (k.length <= 4) return k.map(nomePeriodo).join(', ');
  return `${nomePeriodo(k[0])} a ${nomePeriodo(k[k.length - 1])} (${k.length} períodos)`;
}
const valorQuota = m => m.regimeQuota === 'isento' ? 0 : m.regimeQuota === 'reduzida' ? +CFG.quotaReduzida : +CFG.quotaNormal;
const pagsDe = id => PAGS.filter(p => p.militanteId === id && !p.anulado);

/* Situação de quotas de um militante */
function situacaoQuotas(m) {
  const pagos = new Set(pagsDe(m.id).filter(p => p.tipo === 'quota').flatMap(p => p.periodos || []));
  const atual = periodoDe(hoje());
  if (m.regimeQuota === 'isento') return { isento: true, pagos, atraso: [], divida: 0, atual, atualPago: true };
  if (m.estado !== 'ativo') return { inativo: true, pagos, atraso: [], divida: 0, atual, atualPago: true };
  const datas = [parseISO(m.dataAdmissao), parseISO(CFG.quotasDesde)].filter(Boolean);
  const ini = datas.length ? new Date(Math.max(...datas)) : hoje();
  const devidos = ini <= hoje() ? periodosEntre(ini, hoje()) : [];
  const atraso = devidos.filter(k => k !== atual && !pagos.has(k));
  const ult = [...pagos].sort().pop();
  return { pagos, atraso, divida: r2(atraso.length * valorQuota(m)), atual, atualPago: pagos.has(atual) || !devidos.includes(atual), ultimo: ult };
}
function pillQuota(sq) {
  if (sq.isento) return '<span class="pill mute">Isento</span>';
  if (sq.inativo) return '<span class="pill mute">—</span>';
  if (sq.atraso.length) return `<span class="pill bad">${sq.atraso.length} em atraso</span>`;
  return sq.atualPago ? '<span class="pill">Em dia</span>' : '<span class="pill warn">Período atual por pagar</span>';
}

/* ---------- Verificação legal de um pagamento ---------- */
function verificarLegal(p) {
  const ano = +String(p.dataPagamento).slice(0, 4), I = ias(ano), erros = [], avisos = [];
  if (!(p.valor > 0)) erros.push('Indique um valor superior a zero.');
  if (p.metodo === 'numerario' && p.valor > 0) {
    if (p.valor >= r2(0.25 * I)) erros.push(`Em numerário só são admitidos montantes inferiores a 25% do IAS (${eur(0.25 * I)}). Use cheque, transferência ou outro meio bancário — art. 3.º, n.os 2 e 3, da Lei n.º 19/2003.`);
    const tot = r2(PAGS.filter(x => !x.anulado && x.metodo === 'numerario' && x.ano === ano).reduce((s, x) => s + x.valor, 0));
    if (tot + p.valor > 50 * I) erros.push(`O total anual recebido em numerário ultrapassaria 50 × IAS (${eur(50 * I)}); já registado: ${eur(tot)} — art. 3.º, n.º 3.`);
    else if (tot + p.valor > 40 * I) avisos.push(`Numerário em ${ano}: ${eur(tot + p.valor)} de ${eur(50 * I)} permitidos (art. 3.º, n.º 3).`);
  }
  if (p.tipo === 'donativo') {
    if (!METODOS_DONATIVO.includes(p.metodo)) erros.push('Os donativos têm de ser feitos por cheque ou transferência bancária — art. 7.º, n.º 1.');
    const tot = r2(PAGS.filter(x => !x.anulado && x.tipo === 'donativo' && x.nif === p.nif && x.ano === ano).reduce((s, x) => s + x.valor, 0));
    if (tot + p.valor > 25 * I) erros.push(`Limite anual de donativos por doador (25 × IAS = ${eur(25 * I)}) ultrapassado: este doador já doou ${eur(tot)} em ${ano} — art. 7.º, n.º 1.`);
    else if (tot + p.valor > 20 * I) avisos.push(`Donativos deste doador em ${ano}: ${eur(tot + p.valor)} de ${eur(25 * I)} permitidos.`);
  }
  if (p.metodo !== 'numerario' && !p.referencia) avisos.push('Recomendado: indique a referência do movimento (n.º de cheque, ID da transferência) para a reconciliação bancária — arts. 9.º e 12.º.');
  if (p.metodo !== 'numerario') avisos.push('Confirme que o valor foi depositado na conta bancária exclusiva para estas receitas — art. 3.º, n.º 2, e art. 7.º, n.º 2.');
  return { erros, avisos };
}

/* ---------- Diálogo: registar pagamento ---------- */
function dlgPagamento(militanteId, tipoIni = 'quota') {
  const opts = LISTA.map(x => `<option value="${esc(x.id)}" ${x.id === militanteId ? 'selected' : ''}>${esc(x.nomeCompleto)} — n.º ${esc(x.numMilitante)}</option>`).join('');
  if (!LISTA.length) return toast('Registe primeiro um militante.', true);
  abrirDlg(`<div class="dlg-h"><h3>Registar pagamento</h3><button class="btn ghost sm" data-x aria-label="Fechar">${ICON.x}</button></div>
  <form class="dlg-b" id="pgF" novalidate><div class="form-grid">
    <div class="f c12"><label for="pg_m">Militante <span class="req">*</span></label><select id="pg_m">${militanteId ? '' : '<option value="">Selecione…</option>'}${opts}</select><div class="hint" id="pg_info"></div></div>
    <div class="f c12"><label>Tipo de receita</label><div class="seg" id="pg_tipo">${Object.entries(TIPOS_PAG).map(([k, v]) => `<button type="button" data-t="${k}" class="${k === tipoIni ? 'on' : ''}">${v}</button>`).join('')}</div></div>
    <div class="f c12" id="pg_perWrap"><label>Períodos a pagar</label><div id="pg_per"></div><div class="hint">Clique para selecionar. Períodos já pagos aparecem bloqueados.</div></div>
    <div class="f c4"><label for="pg_v">Valor (€) <span class="req">*</span></label><input id="pg_v" inputmode="decimal" autocomplete="off"><div class="msg" id="pg_vm"></div></div>
    <div class="f c4"><label for="pg_met">Meio de pagamento <span class="req">*</span></label><select id="pg_met">${Object.entries(METODOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
    <div class="f c4"><label for="pg_d">Data do pagamento <span class="req">*</span></label><input id="pg_d" type="date" value="${isoDe(hoje())}" max="${isoDe(hoje())}"></div>
    <div class="f c6"><label for="pg_ref">Referência do movimento</label><input id="pg_ref" maxlength="60" placeholder="n.º cheque / ID transferência"></div>
    <div class="f c6"><label for="pg_obs">Observações</label><input id="pg_obs" maxlength="200"></div>
    <div class="c12" id="pg_legal" style="grid-column:span 12"></div>
  </div></form>
  <div class="dlg-f"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="pg_ok">${ICON.receipt} Registar e emitir recibo</button></div>`);
  let tipo = tipoIni, sel = new Set(), valorManual = false;
  const mil = () => LISTA.find(x => x.id === $('#pg_m').value);
  const desenharPeriodos = () => {
    const m = mil(); const box = $('#pg_per');
    $('#pg_perWrap').hidden = tipo !== 'quota';
    if (!m) { $('#pg_info').textContent = ''; box.innerHTML = ''; return; }
    const sq = situacaoQuotas(m);
    $('#pg_info').innerHTML = `NIF ${esc(m.nif)} · regime ${esc(REGIMES[m.regimeQuota || 'normal'])} · ${eur(valorQuota(m))}/período · ${pillQuota(sq)}${sq.divida ? ` · em dívida ${eur(sq.divida)}` : ''}`;
    if (tipo !== 'quota') return;
    if (sq.isento) { box.innerHTML = '<div class="legal">Este militante está isento de quotas. Pode registar um donativo ou uma contribuição.</div>'; return; }
    const ano = hoje().getFullYear(), anos = new Set([ano, ano + 1]);
    sq.atraso.forEach(k => anos.add(+k.slice(0, 4)));
    const html = [...anos].sort().map(a => {
      const ks = periodosEntre(new Date(a, 0, 1), new Date(a, 11, 31));
      return `<div class="per-ano"><b>${a}</b><div class="per-grid">${ks.map(k => {
        const pago = sq.pagos.has(k), atr = sq.atraso.includes(k);
        return `<button type="button" class="per ${pago ? 'pago' : ''} ${atr ? 'atr' : ''} ${sel.has(k) ? 'on' : ''}" data-k="${k}" ${pago ? 'disabled title="Pago"' : ''}>${esc(nomePeriodo(k).replace(/ \d{4}$/, '').replace(/^ano$/, 'Anual'))}</button>`;
      }).join('')}</div></div>`;
    }).join('');
    box.innerHTML = html + '<div class="per-leg"><span class="per pago">pago</span><span class="per atr">em atraso</span><span class="per on">selecionado</span></div>';
    $$('#pg_per .per[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; sel.has(k) ? sel.delete(k) : sel.add(k); valorManual = false; desenharPeriodos(); calcular(); });
  };
  const calcular = () => {
    const m = mil(); if (tipo === 'quota' && m && !valorManual) $('#pg_v').value = sel.size ? String(r2(sel.size * valorQuota(m)).toFixed(2)).replace('.', ',') : '';
    verificar();
  };
  const dados = () => {
    const m = mil();
    return { tipo, militanteId: m?.id, nif: m?.nif, valor: lerValor($('#pg_v').value), metodo: $('#pg_met').value, dataPagamento: $('#pg_d').value, referencia: $('#pg_ref').value.trim(), observacoes: $('#pg_obs').value.trim(), periodos: tipo === 'quota' ? [...sel].sort() : [] };
  };
  const verificar = () => {
    const p = dados(), m = mil(); const { erros, avisos } = verificarLegal(p);
    if (!m) erros.unshift('Selecione o militante.');
    if (tipo === 'quota' && m && !sel.size && situacaoQuotas(m).isento === undefined) erros.push('Selecione pelo menos um período.');
    /* Valor diferente do devido pelos períodos escolhidos: só com justificação (fica impressa no recibo),
       para nenhum militante ficar "em dia" sem pagar o devido nem ficar registado porquê. */
    if (tipo === 'quota' && m && sel.size && p.valor > 0) {
      const previsto = r2(sel.size * valorQuota(m)), dif = r2(p.valor - previsto);
      if (Math.abs(dif) > 0.004) {
        const txt = `O valor ${dif < 0 ? 'é inferior' : 'é superior'} ao devido pelos períodos escolhidos (${sel.size} × ${eur(valorQuota(m))} = ${eur(previsto)}; diferença de ${eur(Math.abs(dif))}).`;
        if (p.observacoes.length < 10) erros.unshift(`${txt} Ajuste os períodos ou o valor, ou escreva o motivo nas Observações (pelo menos 10 caracteres) — fica impresso no recibo.`);
        else avisos.unshift(`${txt} Motivo indicado nas Observações.`);
      }
    }
    if (!parseISO(p.dataPagamento) || parseISO(p.dataPagamento) > hoje()) erros.push('Data de pagamento inválida.');
    $('#pg_legal').innerHTML = (p.valor > 0 ? `<div class="legal" style="margin-bottom:8px"><b>${eur(p.valor)}</b> — ${esc(porExtenso(p.valor))}</div>` : '')
      + erros.map(e => `<div class="alerta bad">${esc(e)}</div>`).join('') + avisos.map(a => `<div class="alerta warn">${esc(a)}</div>`).join('');
    $('#pg_ok').disabled = erros.length > 0;
    return erros.length === 0;
  };
  $('#pg_m').onchange = () => { sel = new Set(); valorManual = false; const m = mil(); if (m) situacaoQuotas(m).atraso.forEach(k => sel.add(k)); if (m && !sel.size) { const sq = situacaoQuotas(m); if (!sq.isento && !sq.atualPago) sel.add(sq.atual); } desenharPeriodos(); calcular(); };
  $$('#pg_tipo button').forEach(b => b.onclick = () => {
    tipo = b.dataset.t; $$('#pg_tipo button').forEach(x => x.classList.toggle('on', x === b));
    valorManual = false; if (tipo !== 'quota') $('#pg_v').value = '';
    if (tipo === 'donativo' && !METODOS_DONATIVO.includes($('#pg_met').value)) $('#pg_met').value = 'transferencia';
    desenharPeriodos(); calcular();
  });
  $('#pg_v').oninput = () => { valorManual = true; verificar(); };
  ['#pg_met', '#pg_d', '#pg_ref', '#pg_obs'].forEach(id => $(id).addEventListener('input', verificar));
  $('#pg_m').onchange(); 
  $('#pg_ok').onclick = async () => {
    if (!verificar()) return;
    const p = dados(), m = mil(), agora = new Date(), anoR = agora.getFullYear();
    let seq; try { seq = await proximoRecibo(anoR); } catch (e) { return toast(e.message || String(e), true); }
    const reg = {
      ...p, id: uid(), ano: +p.dataPagamento.slice(0, 4), numAno: anoR, numSeq: seq, numRecibo: `${anoR}/${String(seq).padStart(4, '0')}`,
      dataEmissao: isoDe(agora), nome: m.nomeCompleto, numMilitante: m.numMilitante, morada: `${m.morada}, ${m.codigoPostal} ${m.localidade}`,
      anulado: false, criadoEm: agora.toISOString()
    };
    const cfg2 = { ...CFG, recibos: { ...CFG.recibos, [anoR]: seq + 1 } };
    try { await DB.emitir(reg, cfg2); } catch (e) { return toast('Não foi possível emitir o recibo: ' + (e?.message || e), true); }
    CFG = cfg2; await carregar();
    toast(`Recibo ${reg.numRecibo} emitido.`); Audit.log('Recibo emitido', `${reg.numRecibo} — ${TIPOS_PAG[reg.tipo]} ${eur(reg.valor)} — militante n.º ${reg.numMilitante}`);
    verRecibo(reg.id);
    if (VIEW === 'quotas') vQuotasRedesenhar?.();
  };
}

function verRecibo(id) {
  const r = PAGS.find(p => p.id === id); if (!r) return;
  abrirDlg(`<div class="dlg-h"><h3>Recibo ${esc(r.numRecibo)}</h3><button class="btn ghost sm" data-x aria-label="Fechar">${ICON.x}</button></div>
    <div class="dlg-b">${htmlRecibo(r)}</div>
    <div class="dlg-f">${r.anulado ? '' : `<button class="btn danger" id="rcAnul" style="margin-right:auto">Anular recibo</button>`}<button class="btn" data-x>Fechar</button><button class="btn pri" id="rcPrint">${ICON.print} Imprimir</button></div>`);
  $('#rcPrint').onclick = () => { $('#print').innerHTML = `<div class="p-recibo">${htmlRecibo(r)}<div class="rc-corte">✂ — duplicado — ✂</div>${htmlRecibo(r)}</div>`; setTimeout(() => window.print(), 50); };
  $('#rcAnul') && ($('#rcAnul').onclick = async () => {
    const motivo = (prompt(`Anular o recibo ${r.numRecibo}?\nO recibo não é apagado: fica marcado como anulado e o número não é reutilizado.\n\nIndique o motivo:`) || '').trim();
    if (!motivo) return;
    const novo = { ...r, anulado: true, anuladoEm: new Date().toISOString(), motivoAnulacao: motivo.slice(0, 200) };

/* =====================================================================
   FASE 3 — Cartão de militante (PDF + QR) e verificação
   - O QR contém apenas sigla, n.º de militante e um código aleatório do cartão

   - Cada nova via gera um código novo; os códigos anteriores ficam inválidos.

   ===================================================================== */
const carregarScript = (() => {
  const cache = {};
  return src => cache[src] || (cache[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => { delete cache[src]; rej(new Error('Não foi possível carregar ' + src)); }; document.head.append(s);
  }));
})();

const novoCodigo = () => [...crypto.getRandomValues(new Uint8Array(8))].map(b => ALFA[b % 32]).join('');
const fmtCod = c => c ? c.slice(0, 4) + '-' + c.slice(4) : '';

const payloadQR = m => `MIL1${m.cartao.codigo}`;

function estadoCartao(m) {
  if (!m.cartao) return { cls: 'mute', txt: 'Sem cartão', k: 'sem' };
  if (m.estado !== 'ativo') return { cls: 'bad', txt: 'Inválido — filiação não ativa', k: 'inativo' };
  const d = diasAte(parseISO(m.cartao.validade));
  if (d < 0) return { cls: 'bad', txt: 'Caducado', k: 'caducado' };
  if (d <= 60) return { cls: 'warn', txt: `Caduca em ${d} d`, k: 'acaducar' };
  return { cls: '', txt: 'Válido', k: 'valido' };
}

/* Emite (ou reutiliza) o cartão. novaVia = substituição por perda/roubo/alteração de dados. */
async function garantirCartao(id, novaVia = false) {
  const m = await DB.get(id); if (!m) throw new Error('Militante não encontrado.');
  if (m.estado !== 'ativo') throw new Error(`${m.nomeCompleto}: só militantes com filiação ativa podem ter cartão.`);
  const ec = estadoCartao(m);
  if (!novaVia && (ec.k === 'valido' || ec.k === 'acaducar')) return m;
  const via = (m.cartao?.via || 0) + 1, emit = hoje(), val = new Date(emit);
  val.setFullYear(val.getFullYear() + (+CFG.cartaoAnos || 2)); val.setDate(val.getDate() - 1);
  const agora = new Date().toISOString();
  if (m.cartao) m.cartoesAnteriores = [...(m.cartoesAnteriores || []), { codigo: m.cartao.codigo, via: m.cartao.via, ate: isoDe(emit) }];
  m.cartao = { codigo: novoCodigo(), via, emitidoEm: isoDe(emit), validade: isoDe(val) };
  m.historico = [...(m.historico || []), { data: agora, acao: `Cartão emitido — ${via}.ª via, código ${fmtCod(m.cartao.codigo)}, válido até ${fmtData(m.cartao.validade)}${novaVia ? ' (substitui a via anterior)' : ''}` }];
  m.atualizadoEm = agora; await DB.put(m);
  Audit.log('Cartão emitido', `n.º ${m.numMilitante} — ${via}.ª via`);
  return m;
}

const carregarImg = src => new Promise(res => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });

  const rotulo = (t, X, Y) => { x.font = F(700)(18); x.fillStyle = '#6A7464'; if ('letterSpacing' in x) x.letterSpacing = '2px'; x.fillText(t, X, Y); if ('letterSpacing' in x) x.letterSpacing = '0px'; };
  rotulo('N.º DE MILITANTE', DX, y); x.font = F(800)(50); x.fillStyle = '#006530'; x.fillText(m.numMilitante, DX, y + 52);
  y += 100;
  rotulo('ADMISSÃO', DX, y); rotulo('VÁLIDO ATÉ', DX + 190, y);
  x.font = F(700)(28); x.fillStyle = '#16201A'; x.fillText(fmtData(m.dataAdmissao), DX, y + 36); x.fillText(fmtData(m.cartao.validade), DX + 190, y + 36);
  if (m.estrutura) { y += 74; rotulo('ESTRUTURA', DX, y); x.font = F(500)(24); x.fillStyle = '#3A4236'; x.fillText(m.estrutura.length > 34 ? m.estrutura.slice(0, 33) + '…' : m.estrutura, DX, y + 30); }
  // QR
  const QS = 214, QX = W - QS - 36, QY = 182;
  x.fillStyle = '#fff'; rrect(x, QX - 8, QY - 8, QS + 16, QS + 16, 18); x.fill(); x.strokeStyle = '#D9E0D5'; x.lineWidth = 2; x.stroke();
  desenharQR(x, payloadQR(m), QX, QY, QS);
  x.textAlign = 'center'; x.font = F(700)(22); x.fillStyle = '#16201A'; x.fillText(fmtCod(m.cartao.codigo), QX + QS / 2, QY + QS + 40);
  x.font = F(500)(16); x.fillStyle = '#6A7464'; x.fillText(`${m.cartao.via}.ª via · emitido ${fmtData(m.cartao.emitidoEm)}`, QX + QS / 2, QY + QS + 64); x.textAlign = 'left';
  // Rodapé
  x.fillStyle = '#006530'; x.fillRect(0, H - 52, W, 52);
  x.font = F(600)(18); x.fillStyle = 'rgba(255,255,255,.92)';
  x.fillText('Cartão pessoal e intransmissível (art. 20.º, n.º 1, da Lei Orgânica n.º 2/2003)', 40, H - 19);
  x.textAlign = 'right'; x.font = F(800)(20); x.fillStyle = '#A8D767'; x.fillText(CFG.sigla || '', W - 36, H - 18); x.textAlign = 'left';
  return c;
}

/* ---------- PDF ---------- */
async function gerarPDF(militantes, modo) {
  await carregarScript('lib/jspdf.umd.min.js');
  const { jsPDF } = window.jspdf, CW = 85.6, CH = 53.98;
  let doc;
  if (modo === 'cr80') {
    doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [CW, CH] });
    for (let i = 0; i < militantes.length; i++) {
      if (i) doc.addPage([CW, CH], 'landscape');
      const c = await desenharCartao(militantes[i]); doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, CW, CH);
    }
  } else { // A4 com 10 cartões (2 × 5) e marcas de corte
    doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const gx = 6, gy = 3, x0 = (210 - 2 * CW - gx) / 2, y0 = (297 - 5 * CH - 4 * gy) / 2;
    for (let i = 0; i < militantes.length; i++) {
      const k = i % 10; if (i && !k) doc.addPage('a4', 'portrait');
      const X = x0 + (k % 2) * (CW + gx), Y = y0 + Math.floor(k / 2) * (CH + gy);
      const c = await desenharCartao(militantes[i]); doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', X, Y, CW, CH);
      doc.setDrawColor(170); doc.setLineWidth(0.1); doc.rect(X, Y, CW, CH);
    }
  }
  doc.setProperties({ title: 'Cartões de militante', subject: CFG.nomePartido, creator: 'Registo de Militantes' });
  return doc;
}
const nomeFicheiro = (militantes, modo) => militantes.length === 1 ? `cartao-militante_${militantes[0].numMilitante}${modo === 'a4' ? '_A4' : ''}.pdf` : `cartoes-militante_${militantes.length}_${isoDe(hoje())}_${modo}.pdf`;

function verificarCartao(entrada) {
  const t = String(entrada || '').trim().toUpperCase(); if (!t) return;
  let codigo, num = null;
  const p = t.split('|'), mq = t.match(/^MIL1([A-Z0-9]{8})$/);
  if (mq) codigo = mq[1];
  else if (p[0] === 'MIL1' && p.length === 4) { num = p[2]; codigo = p[3]; } // formato antigo
  else codigo = t.replace(/[\s-]/g, '');
  const res = (cls, titulo, corpo) => { $('#vRes').innerHTML = `<h2>Resultado</h2><div class="verif ${cls}"><b>${titulo}</b></div>${corpo || ''}`; };
  if (!/^[A-Z0-9]{8}$/.test(codigo)) return res('bad', 'Código inválido', '<p class="muted">O conteúdo lido não corresponde a um cartão desta aplicação.</p>');
  const m = LISTA.find(x => x.cartao?.codigo === codigo);
  if (!m) {
    const ant = LISTA.find(x => (x.cartoesAnteriores || []).some(c => c.codigo === codigo));
    if (ant) return res('bad', 'CARTÃO SUBSTITUÍDO — INVÁLIDO', `<p>Este cartão de <b>${esc(ant.nomeCompleto)}</b> (n.º ${esc(ant.numMilitante)}) foi substituído por uma via mais recente e já não é válido.</p>`);
    return res('bad', 'Cartão não encontrado', '<p class="muted">O código não existe nesta base de dados. Pode ter sido emitido noutro computador ou ser falso.</p>');
  }
  if (num && num !== m.numMilitante) return res('bad', 'Dados não coincidem', '<p class="muted">O n.º de militante do QR não corresponde ao cartão registado.</p>');
  const ec = estadoCartao(m), sq = situacaoQuotas(m);
  const ok = ec.k === 'valido' || ec.k === 'acaducar';
  res(ok ? (sq.atraso.length ? 'warn' : 'ok') : 'bad', ok ? (sq.atraso.length ? 'CARTÃO VÁLIDO — quotas em atraso' : 'CARTÃO VÁLIDO') : `CARTÃO INVÁLIDO — ${esc(ec.txt)}`,
    `<div class="who" style="margin-top:14px">${m.foto ? `<img src="${esc(m.foto)}" alt="" style="width:96px;height:128px;border-radius:12px;object-fit:cover">` : `<div class="av" style="width:96px;height:128px;font-size:28px">${esc(iniciais(m.nomeCompleto))}</div>`}
     <div><b style="font-size:18px">${esc(m.nomeCompleto)}</b><small class="mono" style="display:block">N.º ${esc(m.numMilitante)} · ${esc(m.concelho)}</small>
     <div class="row" style="margin-top:8px"><span class="pill ${m.estado === 'ativo' ? '' : 'mute'}">${esc(ESTADOS[m.estado])}</span>${pillQuota(sq)}</div>
     <small class="muted" style="display:block;margin-top:6px">Cartão ${m.cartao.via}.ª via · válido até ${fmtData(m.cartao.validade)}</small></div></div>
     <p class="muted" style="font-size:12.5px;margin-bottom:0">Confirme que a fotografia corresponde à pessoa que apresenta o cartão.</p>`);
}

async function lerQRcamara(cb) {
  if (!navigator.mediaDevices?.getUserMedia) return toast('A câmara não está disponível neste navegador.', true);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false }); }
  catch (e) { return toast('Sem acesso à câmara: ' + (e.name === 'NotAllowedError' ? 'permissão recusada.' : 'nenhuma câmara encontrada.'), true); }
  try { await carregarScript('lib/jsQR.js'); } catch (e) { stream.getTracks().forEach(t => t.stop()); return toast(e.message, true); }
  const box = $('#vCamBox'); box.innerHTML = '<video id="vVid" autoplay playsinline muted></video><p class="muted" style="text-align:center;font-size:13px">A procurar código QR… <button class="btn sm" id="vStop">Parar</button></p>';
  const v = $('#vVid'); v.srcObject = stream; const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  let ativo = true, ultimo = '';
  pararCamara = () => { ativo = false; stream.getTracks().forEach(t => t.stop()); if ($('#vCamBox')) $('#vCamBox').innerHTML = ''; pararCamara = null; };
  $('#vStop').onclick = () => pararCamara?.();
  const loop = () => {
    if (!ativo) return;
    if (v.readyState >= 2 && v.videoWidth) {
      const k = Math.min(1, 720 / v.videoWidth); cv.width = v.videoWidth * k | 0; cv.height = v.videoHeight * k | 0;
      cx.drawImage(v, 0, 0, cv.width, cv.height);
      const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'dontInvert' });
      if (r?.data && r.data !== ultimo) { ultimo = r.data; cb(r.data); setTimeout(() => { ultimo = ''; }, 3000); }
    }
    requestAnimationFrame(loop);
  };
  loop();
}

/* =====================================================================
   FASE 4 — Segurança: utilizadores, perfis, cifra e registo de acessos
   - Dados pessoais cifrados em repouso com AES-256-GCM (Web Crypto API).
   - Chave de dados (DEK) aleatória, protegida por cada palavra-passe com
     PBKDF2-SHA256 (600 000 iterações — recomendação OWASP) e por uma chave de recuperação.
   - Nenhuma palavra-passe é guardada: só a DEK cifrada; uma palavra-passe errada
     falha a autenticação AES-GCM.
   - Registo de acessos cifrado e encadeado por SHA-256 (deteta alterações).
   Enquadramento: RGPD arts. 5.º, n.º 1, al. f), 25.º (proteção desde a conceção),
   30.º (registo de atividades) e 32.º (segurança do tratamento, incl. cifragem).
   ===================================================================== */
const te = new TextEncoder(), td = new TextDecoder();
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const b64 = u8 => { u8 = new Uint8Array(u8); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Cripto = {
  dek: null, ITER: 600000,
  async kek(segredo, salt, iter) {
    const base = await crypto.subtle.importKey('raw', te.encode(String(segredo).normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  novaDek: () => crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']),
  async embrulhar(dek, segredo) {
    const salt = rnd(16), iv = rnd(12), k = await Cripto.kek(segredo, salt, Cripto.ITER);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, await crypto.subtle.exportKey('raw', dek));
    return { salt, iv, ct, iter: Cripto.ITER, alg: 'PBKDF2-SHA256/AES-256-GCM' };
  },
  async desembrulhar(w, segredo) { // lança erro se o segredo estiver errado
    const k = await Cripto.kek(segredo, w.salt, w.iter);
    const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: w.iv }, k, w.ct);
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['encrypt', 'decrypt']);
  },
  async enc(obj, extra = {}) {
    if (!Cripto.dek) throw new Error('Sessão bloqueada.');
    const iv = rnd(12);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: te.encode(obj.id) }, Cripto.dek, te.encode(JSON.stringify(obj)));
    return { id: obj.id, ...extra, iv, ct };
  },
  async dec(r) {
    if (!Cripto.dek) throw new Error('Sessão bloqueada.');
    return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: r.iv, additionalData: te.encode(r.id) }, Cripto.dek, r.ct)));
  },
  async sha256(s) { return [...new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s)))].map(b => b.toString(16).padStart(2, '0')).join(''); }
};

/* ---------- Registo de acessos (auditoria) ---------- */
const Audit = {
  seq: 0, prev: '0'.repeat(64), fila: Promise.resolve(),
  async iniciar() {
    Audit.seq = 0; Audit.prev = '0'.repeat(64);
    const recs = await DB.tx('auditoria', 'readonly', s => DB.req(s.getAll()));
    const pc = Audit.pc(), meus = recs.filter(r => pc ? r.id.startsWith(pc + ':') : !r.id.includes(':'));
    if (meus.length) { meus.sort((a, b) => a.id.localeCompare(b.id)); const u = await Cripto.dec(meus[meus.length - 1]); Audit.seq = u.seq; Audit.prev = u.hash; }
  },
  pc: () => (typeof MP !== 'undefined' && MP.ativo) ? MP.cfg.pcId : '', // cada computador tem a sua cadeia
  hashDe: e => Cripto.sha256(e.prev + '|' + JSON.stringify(e.pc ? [e.seq, e.data, e.uid, e.utilizador, e.acao, e.detalhe, e.pc] : [e.seq, e.data, e.uid, e.utilizador, e.acao, e.detalhe])),
  log(acao, detalhe = '') {
    const u = SESSAO?.user;
    Audit.fila = Audit.fila.then(async () => {
      if (!Cripto.dek) return;
      const e = { seq: Audit.seq + 1, data: new Date().toISOString(), uid: u?.id || '', utilizador: u ? `${u.utilizador}` : '—', acao, detalhe: String(detalhe).slice(0, 300), prev: Audit.prev };
      const pc = Audit.pc(); if (pc) e.pc = pc;
      e.hash = await Audit.hashDe(e); e.id = (pc ? pc + ':' : '') + String(e.seq).padStart(10, '0');
      const r = await Cripto.enc(e); await DB.tx('auditoria', 'readwrite', s => DB.req(s.put(r)));
      Audit.seq = e.seq; Audit.prev = e.hash;
      if (pc) await MP.registar([{ t: 'a', op: 'put', id: e.id, o: e }]);
    }).catch(err => console.error('Auditoria:', err));
    return Audit.fila;
  },
  async todos() {
    const recs = await DB.tx('auditoria', 'readonly', s => DB.req(s.getAll()));
    const L = await Promise.all(recs.map(r => Cripto.dec(r).catch(() => { const [a, b] = r.id.includes(':') ? r.id.split(':') : ['', r.id]; return { id: r.id, pc: a, seq: parseInt(b, 10), data: '', utilizador: '?', acao: '⚠ Registo ilegível — possível adulteração', detalhe: '', corrompido: true }; })));
    return L.sort((a, b) => (b.data || '').localeCompare(a.data || '') || b.seq - a.seq);
  },
  async verificar() {
    const T = await Audit.todos(), cadeias = {};
    T.forEach(e => (cadeias[e.pc || ''] = cadeias[e.pc || ''] || []).push(e));
    for (const [pc, L0] of Object.entries(cadeias)) {
      const L = L0.sort((a, b) => a.seq - b.seq), onde = pc ? ` do computador ${pc}` : '';
      for (let i = 0; i < L.length; i++) {
        const e = L[i];
        if (e.corrompido) return { ok: false, n: T.length, falha: e.seq + onde, motivo: 'registo ilegível (cifra adulterada)' };
        if (await Audit.hashDe(e) !== e.hash) return { ok: false, n: T.length, falha: e.seq + onde, motivo: 'conteúdo alterado' };
        if (i && (e.prev !== L[i - 1].hash || e.seq !== L[i - 1].seq + 1)) return { ok: false, n: T.length, falha: e.seq + onde, motivo: 'registo em falta ou fora de ordem' };
      }
    }
    return { ok: true, n: T.length };
  },
  async purgar(dias) {
    const lim = Date.now() - dias * 86400000, L = await Audit.todos(), velhos = L.filter(e => Date.parse(e.data) < lim);
    if (!velhos.length || velhos.length === L.length) return 0;
    await DB.tx('auditoria', 'readwrite', s => { velhos.forEach(e => s.delete(e.id)); });
    return velhos.length;
  }
};

/* ---------- Palavras-passe ---------- */
const COMUNS = ['password', 'palavrapasse', 'passw0rd', '123456', 'qwerty', 'abc123', 'portugal', 'benfica', 'sporting', 'fcporto', 'militante', 'partido', 'admin', 'administrador', 'iloveyou', 'letmein', 'welcome', 'bemvindo'];
function avaliarPassword(pw, utilizador = '', nome = '') {
  const l = pw.toLowerCase(), probs = [];
  if (pw.length < 12) probs.push('pelo menos 12 caracteres');
  if (COMUNS.some(c => l.includes(c))) probs.push('sem palavras comuns (ex.: password, 123456, benfica)');
  if (utilizador && utilizador.length >= 3 && l.includes(utilizador.toLowerCase())) probs.push('não pode conter o nome de utilizador');
  const pn = norm(nome).split(' ').filter(p => p.length >= 4); if (pn.some(p => norm(pw).includes(p))) probs.push('não pode conter o seu nome');
  if (/^(.)\1+$/.test(pw)) probs.push('não pode repetir o mesmo carácter');
  const classes = [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].filter(r => r.test(pw)).length;
  let score = pw.length >= 20 ? 4 : pw.length >= 16 ? 3 : pw.length >= 12 ? 2 : pw.length >= 8 ? 1 : 0;
  if (classes >= 3 && score < 4) score++;
  if (probs.length) score = Math.min(score, 1);
  return { ok: !probs.length, score, msg: probs.length ? 'Requisitos: ' + probs.join('; ') + '.' : ['', 'Fraca', 'Razoável', 'Boa', 'Forte'][score] + (score < 3 ? ' — uma frase com várias palavras é mais segura e fácil de lembrar.' : '.') };
}
const medidor = id => `<div class="pw-meter" id="${id}"><i></i><i></i><i></i><i></i></div><div class="msg" id="${id}_t"></div>`;
function ligarMedidor(inp, id, getU = () => '', getN = () => '') {
  const f = () => { const r = avaliarPassword(inp.value, getU(), getN()); $$(`#${id} i`).forEach((b, i) => b.className = i < r.score ? `s${r.score}` : ''); const t = $(`#${id}_t`); t.textContent = inp.value ? r.msg : ''; t.className = 'msg ' + (r.ok ? 'ok' : 'bad'); };
  inp.addEventListener('input', f);
}

const chaveRecuperacao = () => { const c = novoCodigo() + novoCodigo() + novoCodigo().slice(0, 4); return c.match(/.{4}/g).join('-'); };
const normChave = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
