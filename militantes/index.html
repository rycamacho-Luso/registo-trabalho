/* ---------- Cópias de segurança cifradas ---------- */
function pedirSenhaBackup(criar) {
  return new Promise(res => {
    abrirDlg(`<div class="dlg-h"><h3>${criar ? 'Cifrar cópia de segurança' : 'Cópia de segurança cifrada'}</h3><button class="btn ghost sm" data-x aria-label="Fechar">${ICON.x}</button></div>
      <form class="dlg-b" id="bkF" novalidate autocomplete="off"><p class="muted" style="margin-top:0">${criar ? 'A cópia contém dados sensíveis e é cifrada (AES-256) com a palavra-passe que definir agora. Sem ela, a cópia não pode ser restaurada — guarde-a separadamente.' : 'Introduza a palavra-passe usada ao criar esta cópia de segurança.'}</p>
      <div class="form-grid"><div class="f c12"><label for="bkP">Palavra-passe da cópia</label><input id="bkP" type="password" autocomplete="new-password">${criar ? medidor('bkM') : ''}</div>
      ${criar ? '<div class="f c12"><label for="bkP2">Confirmar</label><input id="bkP2" type="password" autocomplete="new-password"></div>' : ''}</div><div class="msg bad" id="bkE" style="margin-top:8px"></div></form>
      <div class="dlg-f"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="bkB">${criar ? 'Cifrar e descarregar' : 'Abrir'}</button></div>`, () => res(null));
    if (criar) ligarMedidor($('#bkP'), 'bkM');
    $('#bkP').focus(); $('#bkF').onsubmit = e => { e.preventDefault(); $('#bkB').click(); };
    $('#bkB').onclick = () => {
      const p = $('#bkP').value;
      if (criar) { const r = avaliarPassword(p); if (!r.ok) return $('#bkE').textContent = r.msg; if (p !== $('#bkP2').value) return $('#bkE').textContent = 'As palavras-passe não coincidem.'; }
      else if (!p) return;
      fecharDlg(true); res(p);
    };
  });
}
exportarBackup = async function () {
  if (!pode('backup')) return negar();
  const senha = await pedirSenhaBackup(true); if (!senha) return;
  toast('A cifrar a cópia de segurança…');
  const dados = { app: 'registo-militantes', versao: 3, exportadoEm: new Date().toISOString(), config: CFG, militantes: await DB.all(), pagamentos: await DB.allPag() };
  const salt = rnd(16), iv = rnd(12), k = await Cripto.kek(senha, salt, Cripto.ITER);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, te.encode(JSON.stringify(dados)));
  const ficheiro = { app: 'registo-militantes', formato: 'cifrado-v1', alg: 'PBKDF2-SHA256/AES-256-GCM', iter: Cripto.ITER, salt: b64(salt), iv: b64(iv), exportadoEm: dados.exportadoEm, militantes: dados.militantes.length, dados: b64(ct) };
  descarregar(`copia-seguranca-militantes_${isoDe(hoje())}.json`, JSON.stringify(ficheiro), 'application/json');
  CFG.ultimoBackup = new Date().toISOString(); await DB.setCfg(CFG);
  toast('Cópia de segurança cifrada criada.'); if (VIEW === 'config') ir('config');
};
importarBackup = async function (file) {
  if (!pode('backup')) return negar();
  let d; try { d = JSON.parse(await file.text()); } catch { return toast('Ficheiro inválido.', true); }
  if (d?.app !== 'registo-militantes') return toast('Este ficheiro não é uma cópia de segurança desta aplicação.', true);
  if (d.formato === 'cifrado-v1') {
    const senha = await pedirSenhaBackup(false); if (!senha) return;
    try { const k = await Cripto.kek(senha, unb64(d.salt), +d.iter); d = JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(d.iv) }, k, unb64(d.dados)))); }
    catch { return toast('Palavra-passe errada ou ficheiro danificado.', true); }
  } else if (!confirm('Esta cópia é de uma versão antiga e NÃO está cifrada. Depois de restaurar, apague o ficheiro original de forma segura. Continuar?')) return;
  if (!Array.isArray(d.militantes)) return toast('Cópia de segurança sem militantes.', true);
  const campos = ['id', 'nomeCompleto', 'nif', 'numMilitante'];
  const validos = d.militantes.filter(m => m && typeof m === 'object' && campos.every(c => typeof m[c] === 'string' && m[c]) && (!m.foto || /^data:image\/(jpeg|png|webp);base64,/.test(m.foto)));
  if (!confirm(`Importar ${validos.length} militante(s)${Array.isArray(d.pagamentos) ? ` e ${d.pagamentos.length} recibo(s)` : ''}? Registos com o mesmo identificador serão substituídos.`)) return;
  let ok = 0, conflito = 0, okP = 0;
  for (const m of validos) {
    if (LISTA.some(x => x.id !== m.id && (x.nif === m.nif || x.numMilitante === m.numMilitante))) { conflito++; continue; }
    await DB.put(m); LISTA = LISTA.filter(x => x.id !== m.id).concat(m); ok++;
  }
  for (const p of d.pagamentos || []) {
    if (!p || typeof p !== 'object' || typeof p.id !== 'string' || !/^\d{4}\/\d{4,}$/.test(p.numRecibo || '') || !(+p.valor > 0) || !TIPOS_PAG[p.tipo] || !METODOS[p.metodo]) continue;
    if (PAGS.some(x => x.id !== p.id && x.numRecibo === p.numRecibo)) { conflito++; continue; }
    try { await DB.putPag(p); okP++; } catch { conflito++; }
  }
  if (d.config && typeof d.config === 'object') {
    const c = d.config; CFG.proximoNum = Math.max(CFG.proximoNum, +c.proximoNum || 1);
    for (const [a, n] of Object.entries(c.recibos || {})) if (/^\d{4}$/.test(a)) CFG.recibos[a] = Math.max(+CFG.recibos[a] || 1, +n || 1);
    await DB.setCfg(CFG);
  }
  Audit.log('Cópia de segurança restaurada', `${ok} militante(s), ${okP} recibo(s), ${conflito} conflito(s)`);
  await carregar(); toast(`${ok} militante(s) e ${okP} recibo(s) importados${conflito ? `; ${conflito} ignorado(s) por duplicação (NIF, n.º ou recibo)` : ''}.`, !!conflito); ir('lista');
};

/* =====================================================================
   VÁRIOS COMPUTADORES NA MESMA SEDE (pasta partilhada na rede local)
   - Cada computador mantém uma cópia local cifrada e escreve as suas alterações
     na pasta partilhada como lotes cifrados (AES-256-GCM, mesma chave de dados).
   - Sincronização a cada 10 s; em caso de conflito vence a alteração mais recente.
   - Recibos anulados nunca "desanulam".
   - Números de militante e de recibo atribuídos sob bloqueio exclusivo na pasta:
     uma única série para toda a sede, sem números repetidos.
   - Disponível na aplicação para Windows (window.partilha, via preload).
   ===================================================================== */
const PT = window.partilha || null;
const serW = w => w && { ...w, salt: b64(w.salt), iv: b64(w.iv), ct: b64(w.ct) };
const desW = w => w && { ...w, salt: unb64(w.salt), iv: unb64(w.iv), ct: unb64(w.ct) };
const serU = u => ({ ...u, wrap: serW(u.wrap) });
const desU = u => ({ ...u, wrap: desW(u.wrap) });
const MP = {
  cfg: null, o: {}, aplicando: false, online: null, ultimaSync: 0, ocupado: false, filaEsc: Promise.resolve(), ultimoPosto: 0, redesenhar: false,
  get ativo() { return !!(PT && MP.cfg?.ativo); },
  async carregarCfg() { MP.cfg = await DB.tx('config', 'readonly', s => DB.req(s.get('multiposto'))) || null; },
  guardarCfg() { return DB.tx('config', 'readwrite', s => DB.req(s.put(MP.cfg, 'multiposto'))); },
  async lerJSON(rel) { const s = await PT.ler(rel); return s == null ? null : JSON.parse(td.decode(unb64(s))); },
  escreverJSON(rel, o) { return PT.escrever(rel, b64(te.encode(JSON.stringify(o)))); },
  async encLote(nome, obj) {
    const iv = rnd(12), ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: te.encode(nome) }, Cripto.dek, te.encode(JSON.stringify(obj)));
    const u = new Uint8Array(12 + ct.byteLength); u.set(iv); u.set(new Uint8Array(ct), 12); return b64(u);
  },
  async decLote(nome, s) { const u = unb64(s); return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12), additionalData: te.encode(nome) }, Cripto.dek, u.slice(12)))); },

  /* Regista alterações locais para envio (cifradas e guardadas antes de enviar: nada se perde se a rede falhar) */
  async registar(alts) {
    if (!MP.ativo || MP.aplicando || !alts.length || !Cripto.dek) return;
    const ts = new Date().toISOString();
    for (const a of alts) { a.ts = ts; a.pc = MP.cfg.pcId; if (a.t !== 'a') MP.cfg.versoes[a.t + ':' + a.id] = ts + '|' + MP.cfg.pcId; }
    const nome = `dados/${MP.cfg.pcId}/${String(++MP.cfg.seq).padStart(10, '0')}.bin`;
    MP.cfg.pendentes.push({ nome, b: await MP.encLote(nome, alts) });
    await MP.guardarCfg(); MP.escoar();
  },
  escoar() {
    MP.filaEsc = MP.filaEsc.then(async () => {
      while (MP.cfg?.pendentes?.length) {
        const p = MP.cfg.pendentes[0];
        try { await PT.escrever(p.nome, p.b); } catch { MP.online = false; MP.estado(); return false; }
        MP.cfg.pendentes.shift(); await MP.guardarCfg();
      }
      return true;
    });
    return MP.filaEsc;
  },

  /* Aplica alterações de outros computadores (vence a mais recente) */
  async aplicar(alts) {
    let mudou = false; MP.aplicando = true;
    try {
      for (const a of alts) {
        if (a.t === 'a') {
          const ex = await DB.tx('auditoria', 'readonly', s => DB.req(s.getKey(a.id)));
          if (!ex) { const r = await Cripto.enc(a.o); await DB.tx('auditoria', 'readwrite', s => DB.req(s.put(r))); }
          continue;
        }
        const k = a.t + ':' + a.id, v = a.ts + '|' + a.pc, cur = MP.cfg.versoes[k];
        if (cur && cur >= v) continue;
        MP.cfg.versoes[k] = v; mudou = true;
        if (a.t === 'm') { if (a.op === 'del') await MP.o.del(a.id); else await MP.o.put(a.o); }
        else if (a.t === 'p') {
          if (a.op === 'del') { await DB.tx('p3', 'readwrite', s => DB.req(s.delete(a.id))); continue; }
          let o = a.o; const r0 = await DB.tx('p3', 'readonly', s => DB.req(s.get(a.id)));
          if (r0) { const loc = await Cripto.dec(r0); if (loc.anulado && !o.anulado) o = { ...o, anulado: true, anuladoEm: loc.anuladoEm, motivoAnulacao: loc.motivoAnulacao }; }
          try { await MP.o.putPag(o); } catch (e) { Audit.log('Conflito de numeração de recibo', `${o.numRecibo} recebido de outro posto foi rejeitado`); }
        }
      }
    } finally { MP.aplicando = false; }
    return mudou;
  },
  async puxar() {
    let mudou = false;
    for (const pc of await PT.listarDirs('dados')) {
      if (pc === MP.cfg.pcId || !/^[A-Z0-9]{8}$/.test(pc)) continue;
      const cur = MP.cfg.cursores[pc] || 0;
      const fich = (await PT.listar('dados/' + pc)).filter(n => /^\d{10}\.bin$/.test(n)).map(n => parseInt(n, 10)).filter(n => n > cur).sort((a, b) => a - b);
      for (const n of fich) {
        const nome = `dados/${pc}/${String(n).padStart(10, '0')}.bin`, s = await PT.ler(nome);
        if (s == null) break;
        let alts; try { alts = await MP.decLote(nome, s); } catch { console.error('Lote ilegível', nome); MP.cfg.cursores[pc] = n; continue; }
        if (await MP.aplicar(alts)) mudou = true;
        MP.cfg.cursores[pc] = n;
      }
    }
    if (await MP.puxarUtilizadores()) mudou = true;
    const c = await MP.lerJSON('config.json');
    if (c && (c.alteradoEm || '') > (CFG.alteradoEm || '')) { CFG = { ...CFG_PADRAO, ...c }; MP.aplicando = true; try { await MP.o.setCfg(CFG); } finally { MP.aplicando = false; } aplicarMarca(); mudou = true; }
    const org = await MP.lerJSON('org.json'), rec = await DB.getRec();
    if (org?.rec && (org.rec.criadaEm || '') > (rec?.criadaEm || '')) await MP.o.setRec(desW(org.rec));
    return mudou;
  },
  async puxarUtilizadores() {
    let mudou = false; const locais = new Map((await DB.users()).map(u => [u.id, u]));
    for (const f of await PT.listar('utilizadores')) {
      if (!/\.json$/.test(f)) continue;
      let u; try { u = desU(await MP.lerJSON('utilizadores/' + f)); } catch { continue; }
      const l = locais.get(u.id);
      if (l && (u.alteradoEm || '') <= (l.alteradoEm || '')) continue;
      await MP.o.putUser(u); mudou = true;
      if (SESSAO && SESSAO.user.id === u.id) { SESSAO.user = u; if (!u.ativo) setTimeout(() => bloquear('A sua conta foi desativada por um administrador.'), 0); }
    }
    return mudou;
  },
  async sincronizar(manual = false) {
    if (!MP.ativo || !SESSAO || MP.ocupado) return;
    MP.ocupado = true;
    try {
      if (!(await PT.disponivel())) { MP.online = false; if (manual) toast('Pasta partilhada indisponível. Verifique a ligação à rede.', true); return; }
      await MP.escoar();
      const mudou = await MP.puxar();
      await MP.guardarCfg(); MP.online = true; MP.ultimaSync = Date.now();
      if (Date.now() - MP.ultimoPosto > 60000) { MP.ultimoPosto = Date.now(); MP.escreverJSON(`postos/${MP.cfg.pcId}.json`, { nome: MP.cfg.nomePC, ultimaSync: new Date().toISOString(), utilizador: SESSAO.user.utilizador }).catch(() => {}); }
      if (mudou) {
        await carregar();
        if (!$('#dlg').open && !['novo', 'editar'].includes(VIEW) && VIEW !== 'cartoes') ir(VIEW); else MP.redesenhar = true;
      }
      if (manual) toast('Sincronizado.');
    } catch (e) { MP.online = false; console.error('Sincronização:', e); if (manual) toast('Erro ao sincronizar: ' + (e.message || e), true); }
    finally { MP.ocupado = false; MP.estado(); }
  },
  estado() {
    const el = $('#mpEstado'); if (!el) return;
    if (!MP.ativo || !SESSAO) { el.innerHTML = ''; return; }
    const pend = MP.cfg.pendentes.length;
    el.innerHTML = MP.online === false
      ? `<span class="mp-dot bad"></span>Rede indisponível — a trabalhar localmente${pend ? ` (${pend} por enviar)` : ''}`
      : `<span class="mp-dot"></span>${esc(MP.cfg.nomePC)} · sincronizado${MP.ultimaSync ? ' às ' + new Date(MP.ultimaSync).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : ''}`;
  },

  /* Numeração única para toda a sede (bloqueio exclusivo na pasta partilhada) */
  async comBloqueio(fn) {
    const nome = 'contadores.lock', ini = Date.now();
    for (;;) {
      if (await PT.criarExclusivo(nome, b64(te.encode(JSON.stringify({ pc: MP.cfg.pcId, ts: Date.now() }))))) break;
      try { const l = await MP.lerJSON(nome); if (l && Date.now() - l.ts > 20000) { await PT.apagar(nome); continue; } } catch { }
      if (Date.now() - ini > 10000) throw new Error('A numeração está a ser usada por outro computador. Tente novamente dentro de instantes.');
      await new Promise(r => setTimeout(r, 120 + Math.random() * 180));
    }
    try { return await fn(); } finally { await PT.apagar(nome).catch(() => { }); }
  },
  async contadores(fn) {
    if (!(await PT.disponivel())) throw new Error('Pasta partilhada indisponível: para garantir números únicos em toda a sede, a atribuição de números exige ligação à rede.');
    return MP.comBloqueio(async () => { const c = await MP.lerJSON('contadores.json') || { militante: 1, recibos: {} }; c.recibos = c.recibos || {}; const r = await fn(c); await MP.escreverJSON('contadores.json', c); return r; });
  },

  /* Ativar a partilha a partir deste computador (que passa a ser a origem dos dados) */
  async ativarAqui(nomePC) {
    const est = await PT.escolher(); if (!est?.ok) return false;
    const org = await MP.lerJSON('org.json');
    if (org) { await PT.esquecer(); throw new Error('Esta pasta já tem dados de outro computador. Para juntar este computador a eles, use um computador sem dados e escolha "Ligar a uma pasta partilhada" no ecrã inicial.'); }
    MP.cfg = { ativo: true, orgId: uid(), pcId: novoCodigo(), nomePC, seq: 0, cursores: {}, versoes: {}, pendentes: [] };
    await MP.guardarCfg();
    await MP.escreverJSON('org.json', { app: 'registo-militantes', orgId: MP.cfg.orgId, criadoEm: new Date().toISOString(), rec: serW(await DB.getRec()) });
    for (const u of await DB.users()) { u.alteradoEm = u.alteradoEm || new Date().toISOString(); await MP.o.putUser(u); await MP.escreverJSON('utilizadores/' + u.id + '.json', serU(u)); }
    CFG.alteradoEm = new Date().toISOString(); await MP.o.setCfg(CFG); await MP.escreverJSON('config.json', CFG);
    const maxNum = Math.max(0, ...LISTA.map(m => parseInt(String(m.numMilitante).replace(/\D/g, ''), 10) || 0));
    await MP.escreverJSON('contadores.json', { militante: Math.max(+CFG.proximoNum || 1, maxNum + 1), recibos: { ...CFG.recibos } });
    const M = await DB.all(), P = await DB.allPag(), A = await Audit.todos();
    for (let i = 0; i < M.length; i += 20) await MP.registar(M.slice(i, i + 20).map(m => ({ t: 'm', op: 'put', id: m.id, o: m })));
    for (let i = 0; i < P.length; i += 100) await MP.registar(P.slice(i, i + 100).map(p => ({ t: 'p', op: 'put', id: p.id, o: p })));
    for (let i = 0; i < A.length; i += 200) await MP.registar(A.slice(i, i + 200).filter(e => !e.corrompido).map(e => ({ t: 'a', op: 'put', id: e.id, o: e })));
    await MP.escoar(); await Audit.iniciar();
    Audit.log('Partilha entre computadores ativada', `posto ${nomePC}; ${M.length} militante(s), ${P.length} recibo(s)`);
    MP.online = true; MP.ultimaSync = Date.now(); MP.estado();
    return true;
  },
  async desligar() {
    Audit.log('Computador desligado da partilha', MP.cfg.nomePC); await MP.escoar();
    MP.cfg.ativo = false; await MP.guardarCfg(); await PT.esquecer(); await Audit.iniciar(); MP.estado();
  }
};

  ecra(`${cabecalhoAuth('Ligar este computador à sede')}
    <h1>Ligar este computador</h1>

  $('#jnN').focus();

  $('#jnF').onsubmit = async e => {

    } catch (err) { er.textContent = 'Erro: ' + (err?.message || err); $('#jnB').disabled = false; $('#jnB').textContent = 'Tentar novamente'; }
  };

/* Numeração: recibos e militantes */
async function proximoRecibo(ano) {
  if (!MP.ativo) return +(CFG.recibos?.[ano]) || 1;
  return MP.contadores(c => {
    const conhecido = Math.max(0, ...PAGS.filter(p => p.numAno === ano).map(p => p.numSeq || 0));
    const seq = Math.max(+c.recibos[ano] || 1, +(CFG.recibos?.[ano]) || 1, conhecido + 1);
    c.recibos[ano] = seq + 1; return seq;
  });
}
async function proximoMilitante() {
  return MP.contadores(c => {
    const conhecido = Math.max(0, ...LISTA.map(m => parseInt(String(m.numMilitante).replace(/\D/g, ''), 10) || 0));
    let n = Math.max(+c.militante || 1, +CFG.proximoNum || 1, conhecido + 1);
    while (LISTA.some(m => m.numMilitante === numFmt(n))) n++;
    c.militante = n + 1; return numFmt(n);
  });
}

/* Interceção das escritas locais para as partilhar */
{
  const o = MP.o;
  for (const k of ['put', 'del', 'putPag', 'emitir', 'clear', 'clearPag', 'putUser', 'setCfg', 'setRec']) o[k] = DB[k];
  DB.put = async m => { await o.put(m); await MP.registar([{ t: 'm', op: 'put', id: m.id, o: m }]); };
  DB.del = async id => { await o.del(id); await MP.registar([{ t: 'm', op: 'del', id }]); };
  DB.putPag = async p => { await o.putPag(p); await MP.registar([{ t: 'p', op: 'put', id: p.id, o: p }]); };
  DB.emitir = async (p, cfg) => { if (MP.ativo) cfg.alteradoEm = new Date().toISOString(); await o.emitir(p, cfg); await MP.registar([{ t: 'p', op: 'put', id: p.id, o: p }]); if (MP.ativo) MP.escreverJSON('config.json', cfg).catch(() => { }); };
  DB.clear = async () => { const ids = await DB.tx('m3', 'readonly', s => DB.req(s.getAllKeys())); await o.clear(); await MP.registar(ids.map(id => ({ t: 'm', op: 'del', id }))); };
  DB.clearPag = async () => { const ids = await DB.tx('p3', 'readonly', s => DB.req(s.getAllKeys())); await o.clearPag(); await MP.registar(ids.map(id => ({ t: 'p', op: 'del', id }))); };
  DB.putUser = async u => {
    const partilhar = MP.ativo && !MP.aplicando; if (partilhar) u.alteradoEm = new Date().toISOString();
    await o.putUser(u); if (partilhar) MP.escreverJSON('utilizadores/' + u.id + '.json', serU(u)).catch(() => { });
  };
  DB.setCfg = async c => {
    const partilhar = MP.ativo && !MP.aplicando; if (partilhar) c.alteradoEm = new Date().toISOString();
    await o.setCfg(c); if (partilhar) MP.escreverJSON('config.json', c).catch(() => { });
  };
  DB.setRec = async w => {
    await o.setRec(w);
    if (MP.ativo && !MP.aplicando) { const org = await MP.lerJSON('org.json').catch(() => null); if (org) MP.escreverJSON('org.json', { ...org, rec: serW(w) }).catch(() => { }); }
  };
}
setInterval(() => MP.sincronizar(false), 10000);

/* Separador "Vários computadores" (Segurança) */
async function abaPostos() {
  const box = $('#sConteudo');
  if (!PT) { box.innerHTML = `<div class="card pad"><h2>Vários computadores</h2><p class="muted">Disponível apenas na <b>aplicação para Windows</b> (o navegador não pode aceder a pastas da rede).</p></div>`; return; }
  if (!MP.ativo) {
    box.innerHTML = `<div class="grid2"><div class="card pad"><h2>Partilhar os dados entre computadores da sede</h2>
      <p class="muted" style="margin-top:0">Use uma <b>pasta partilhada da rede local</b> (num dos computadores ou num disco de rede/NAS) a que os computadores da sede tenham acesso. A pasta só guarda dados <b>cifrados</b>.</p>
      <ol class="muted" style="font-size:13.5px;padding-left:18px"><li>Neste computador (o que já tem os dados): escolha a pasta e ative.</li><li>Nos outros computadores: instale a aplicação e, no ecrã inicial, escolha <b>"Ligar a uma pasta partilhada"</b>.</li></ol>
      <div class="f" style="margin-top:12px"><label for="mpN">Nome deste computador</label><input id="mpN" maxlength="40" value="Principal"></div>
      <button class="btn pri" id="mpA" style="margin-top:14px">Escolher pasta partilhada e ativar</button></div>
      <div class="card pad"><h2>Requisitos e cuidados</h2><ul class="muted" style="margin:0;padding-left:18px;font-size:13.5px">
        <li>Permissões da pasta (Windows): só as contas da sede, com leitura e escrita.</li>
        <li>O computador ou disco onde está a pasta tem de estar ligado para emitir recibos e atribuir números de militante.</li>
        <li>Sem rede, cada computador continua a funcionar e envia as alterações quando a ligação voltar.</li>
        <li>Relógios dos computadores certos (sincronização automática de hora do Windows): em edições simultâneas da mesma ficha vence a mais recente.</li>
        <li>Continue a fazer cópias de segurança cifradas regularmente.</li></ul></div></div>`;
    $('#mpA').onclick = async () => {
      const nome = $('#mpN').value.trim(); if (nome.length < 2) return toast('Indique um nome para este computador.', true);
      if (!confirm('Ativar a partilha? Todos os dados deste computador serão copiados, cifrados, para a pasta que escolher.')) return;
      try { $('#mpA').disabled = true; $('#mpA').textContent = 'A copiar os dados…'; if (await MP.ativarAqui(nome)) { toast('Partilha ativada.'); abaPostos(); } else { $('#mpA').disabled = false; $('#mpA').textContent = 'Escolher pasta partilhada e ativar'; } }
      catch (e) { toast(e.message || String(e), true); $('#mpA').disabled = false; $('#mpA').textContent = 'Escolher pasta partilhada e ativar'; }
    };
    return;
  }
  const est = await PT.estado(), postos = [];
  for (const f of await PT.listar('postos').catch(() => [])) { try { postos.push({ id: f.replace('.json', ''), ...(await MP.lerJSON('postos/' + f)) }); } catch { } }
  box.innerHTML = `<div class="grid2"><div class="card pad"><h2>Partilha ativa</h2>
      <div class="dl" style="grid-template-columns:1fr"><div><span>Pasta partilhada</span><b class="mono" style="word-break:break-all">${esc(est.caminho || '—')}</b></div>
      <div><span>Este computador</span><b>${esc(MP.cfg.nomePC)} <small class="muted mono">(${esc(MP.cfg.pcId)})</small></b></div>
      <div><span>Estado</span><b>${MP.online === false ? '<span class="pill bad">Rede indisponível</span>' : '<span class="pill">Ligado</span>'} ${MP.cfg.pendentes.length ? `<span class="pill warn">${MP.cfg.pendentes.length} alteração(ões) por enviar</span>` : ''}</b></div>
      <div><span>Última sincronização</span><b>${MP.ultimaSync ? fmtDataHora(new Date(MP.ultimaSync).toISOString()) : '—'}</b></div></div>
      <div class="row" style="margin-top:16px"><button class="btn pri" id="mpS">Sincronizar agora</button><button class="btn danger" id="mpD">Desligar este computador</button></div></div>
    <div class="card pad"><h2>Computadores ligados</h2>${postos.length ? `<table class="mini"><tbody>${postos.map(p => `<tr><td><b>${esc(p.nome || p.id)}</b>${p.id === MP.cfg.pcId ? ' <small class="muted">(este)</small>' : ''}</td><td class="muted">${esc(p.utilizador || '')}</td><td class="mono muted">${p.ultimaSync ? fmtDataHora(p.ultimaSync) : '—'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Ainda sem registos.</p>'}</div></div>`;
  $('#mpS').onclick = async () => { await MP.sincronizar(true); abaPostos(); };
  $('#mpD').onclick = async () => { if (!confirm('Desligar este computador da pasta partilhada? Os dados locais mantêm-se, mas deixam de ser sincronizados.')) return; await MP.desligar(); toast('Computador desligado da partilha.'); abaPostos(); };
}

/* ---------- Arranque ---------- */
window.addEventListener('beforeunload', e => { if (FORM_SUJO) { e.preventDefault(); e.returnValue = ''; } });
(async () => {
  try { await DB.open(); } catch (e) { $('#main').innerHTML = '<div class="card pad"><h2>Erro</h2><p>Não foi possível abrir a base de dados local. Verifique se o navegador permite armazenamento.</p></div>'; return; }
  CFG = { ...CFG_PADRAO, ...(await DB.getCfg() || {}) };
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  aplicarMarca();
  await MP.carregarCfg();
  if ((await DB.users()).length) ecraLogin(); else ecraSetup();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
